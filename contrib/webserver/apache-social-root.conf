#
# Put the Mastodon client API of Aloha Social at the root of the domain.
#
# A Mastodon app is given a domain and builds https://<domain>/api/v1/... from
# it. None of them accept a path, so without these rules the app cannot add an
# account here at all. The web interface and federation with other servers do
# not need them.
#
# Include this from the <VirtualHost> that serves Nextcloud. It cannot go in an
# .htaccess file: ProxyPreserveHost is not allowed there, and without it the
# app sees Host: 127.0.0.1 and refuses the request as an untrusted domain.
#
# Needs mod_proxy, mod_proxy_http, mod_rewrite and mod_headers.
#
# Adjust the /index.php prefix if this instance serves Nextcloud from a
# subdirectory: /cloud/index.php, and so on.
#
# CHECK WHAT 127.0.0.1:80 ACTUALLY SERVES. These rules proxy to plain HTTP on
# the loopback address, and that only works if something there serves *this*
# Nextcloud. A server whose only virtual hosts are on :443 -- which is what a
# certbot-managed config looks like once the HTTP ones have been commented out
# -- has no :80 virtual host for the domain at all, so the request falls
# through to the main server and its DocumentRoot, and every proxied request
# answers 404 from there.
#
# That 404 looks exactly like having no rules at all. The way to tell: an
# Apache error page names the port it came from, so /api/v1/instance answering
# "Server at example.com Port 80" while some unproxied path answers "Port 443"
# means the rules fired and the target is wrong.
#
# The fix is to give the proxy something to land on -- a loopback-only listener
# serving the Nextcloud document root, which keeps plain HTTP off the public
# interface:
#
#     Listen 127.0.0.1:8081
#     <VirtualHost 127.0.0.1:8081>
#         ServerName example.com
#         DocumentRoot /path/to/nextcloud
#         <Directory /path/to/nextcloud>
#             Options FollowSymLinks
#             AllowOverride All
#             Require ip 127.0.0.1
#         </Directory>
#     </VirtualHost>
#
# and to point the rules below at http://127.0.0.1:8081 instead. AllowOverride
# All matters: Nextcloud's own .htaccess is what hands the Authorization header
# to PHP, and without it every signed-in request answers "the access_token was
# revoked".
#
# These requests arrive from 127.0.0.1 afterwards, so add that to
# `trusted_proxies` in config.php; without it every client shares one address
# for rate limiting, brute-force protection and the log. mod_proxy already
# sends the client's own address along in X-Forwarded-For.

ProxyPreserveHost On

# The scheme, which mod_proxy does not send by itself. It sets X-Forwarded-For
# and X-Forwarded-Host and stops there, and the target below is plain HTTP --
# so without this Nextcloud believes every proxied request arrived over http
# and builds every absolute URL it answers with accordingly. A client is then
# handed http:// addresses for its own avatars, posts and the instance
# thumbnail, on a site that is https; an iOS client refuses them outright
# (App Transport Security) and its sign-in stops dead with nothing to see.
#
# Needs mod_headers, and belongs in the HTTPS virtual host -- it is a
# statement about how the request reached this server, so setting it in a
# plain-HTTP vhost would be a lie. `trusted_proxies` in config.php has to
# name the proxy for Nextcloud to believe any of these headers.
RequestHeader set X-Forwarded-Proto "https"

<IfModule mod_rewrite.c>
    RewriteEngine On

    # The client API and the OAuth endpoints an app talks to.
    #
    # [P] rather than a plain rewrite, and not a redirect. Nextcloud builds the
    # route from REQUEST_URI, which an internal rewrite does not change, so a
    # plain rewrite reaches PHP but not the route and answers 404. A redirect
    # does reach the route, but many HTTP clients drop the Authorization header
    # when they follow one, so every signed-in request then answers 401.
    #
    # `^/?` on purpose: inside <VirtualHost> the path still has its leading
    # slash and inside a <Directory> it does not.
    RewriteRule ^/?api/(.*)$   http://127.0.0.1/index.php/apps/social/api/$1   [P,QSA,L]
    RewriteRule ^/?oauth/(.*)$ http://127.0.0.1/index.php/apps/social/oauth/$1 [P,QSA,L]

    # Discovery. webfinger and nodeinfo are already redirected by Nextcloud's
    # own rules; host-meta is not, and some clients ask for it first.
    RewriteRule ^/?\.well-known/host-meta$ http://127.0.0.1/index.php/.well-known/host-meta [P,QSA,L]

    # RFC 8414 discovery. A Mastodon 4.3 client asks for this before it
    # registers anything, and takes a 404 as "this is not a server I can sign
    # in to" -- so leaving it out is a client that never opens a browser.
    RewriteRule ^/?\.well-known/oauth-authorization-server$ http://127.0.0.1/index.php/apps/social/.well-known/oauth-authorization-server [P,QSA,L]

    # An app sends its bearer token in the Authorization header. Apache does not
    # hand that to PHP on every setup, and without it every request from a
    # signed-in app answers 401.
    RewriteCond %{HTTP:Authorization} ^(.+)$
    RewriteRule .* - [env=HTTP_AUTHORIZATION:%1]
</IfModule>

# Requires proxy_wstunnel and the loopback social:atproto:serve daemon.
ProxyPass "/xrpc/com.atproto.sync.subscribeRepos" "ws://127.0.0.1:8080/xrpc/com.atproto.sync.subscribeRepos"
ProxyPassReverse "/xrpc/com.atproto.sync.subscribeRepos" "ws://127.0.0.1:8080/xrpc/com.atproto.sync.subscribeRepos"
RewriteRule ^/?xrpc/(.*)$ /index.php/apps/social/xrpc/$1 [PT,L]
RewriteRule ^/?\.well-known/atproto-did$ /index.php/apps/social/.well-known/atproto-did [PT,L]
RewriteRule ^/?\.well-known/did\.json$ /index.php/apps/social/.well-known/did.json [PT,L]
