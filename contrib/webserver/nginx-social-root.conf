#
# Put the Mastodon client API of Aloha Social at the root of the domain.
#
# A Mastodon app is given a domain and builds https://<domain>/api/v1/... from
# it. None of them accept a path, so without these rules the app cannot add an
# account here at all. The web interface and federation with other servers do
# not need them.
#
# Include this inside the `server { }` block that serves Nextcloud, before the
# generic `location /` block. Adjust /index.php if Nextcloud is served from a
# subdirectory, and the upstream address if this server does not answer plain
# HTTP on 127.0.0.1:80.
#
# These proxy back into this same server rather than rewriting in place, which
# is what the `break` is for. Nextcloud routes on the address the request
# arrived at, and `$request_uri` — which is what reaches PHP — is not changed
# by a `rewrite ... last`, so rewriting in place reaches PHP but not the route
# and answers 404. Redirecting instead does reach the route, but many clients
# drop the Authorization header when they follow a redirect, so every signed-in
# request then answers 401.
#
# The requests arrive from 127.0.0.1 afterwards, so add that to
# `trusted_proxies` in config.php; without it every client shares one address
# for rate limiting, brute-force protection and the log.

location ^~ /api/ {
    rewrite ^/api/(.*)$ /index.php/apps/social/api/$1 break;
    proxy_pass http://127.0.0.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location ^~ /oauth/ {
    rewrite ^/oauth/(.*)$ /index.php/apps/social/oauth/$1 break;
    proxy_pass http://127.0.0.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# webfinger and nodeinfo are already redirected by the stock Nextcloud
# configuration; host-meta is not, and some clients ask for it first.
location = /.well-known/host-meta {
    rewrite ^ /index.php/.well-known/host-meta break;
    proxy_pass http://127.0.0.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# RFC 8414 discovery. A Mastodon 4.3 client asks for this before it registers
# anything, and takes a 404 as "this is not a server I can sign in to".
location = /.well-known/oauth-authorization-server {
    rewrite ^ /index.php/apps/social/.well-known/oauth-authorization-server break;
    proxy_pass http://127.0.0.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Bluesky. The DID document names this host as the PDS, so the AT Protocol
# surface is at the root like the client API. The firehose is a WebSocket the
# daemon (occ social:atproto:serve) serves on 127.0.0.1:8787; it is the one
# method that is a stream, so it is proxied with the upgrade.
location = /xrpc/com.atproto.sync.subscribeRepos {
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
}

location ^~ /xrpc/ {
    rewrite ^/xrpc/(.*)$ /index.php/apps/social/xrpc/$1 break;
    proxy_pass http://127.0.0.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# The instance's own did:web document.
location = /.well-known/did.json {
    rewrite ^ /index.php/apps/social/.well-known/did.json break;
    proxy_pass http://127.0.0.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Bluesky handles: a server block for the wildcard host. Every account's
# handle is alice.<host>, resolved by a GET of
# https://alice.<host>/.well-known/atproto-did, so the wildcard host (a
# *.<host> DNS record and a certificate that covers it) reaches the app, which
# answers the DID of the handle it was asked on. Nextcloud must list `*.<host>`
# in trusted_domains. Replace social.example.com with your host.
#
# server {
#     listen 443 ssl;
#     server_name *.social.example.com;
#     # ssl_certificate and ssl_certificate_key: the wildcard certificate
#     location = /.well-known/atproto-did {
#         rewrite ^ /index.php/apps/social/.well-known/atproto-did break;
#         proxy_pass http://127.0.0.1;
#         proxy_set_header Host $host;
#         proxy_set_header X-Forwarded-Proto $scheme;
#     }
#     location / { return 404; }
# }
