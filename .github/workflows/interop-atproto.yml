#
# Interop against Bluesky's own software: this app as a PDS, its handles
# resolved and its firehose read by the official PLC directory, PDS and
# AppView (`@atproto/dev-env`), and, when it comes up, its commits verified
# by the official relay. See tests/Interop/AtprotoVisibleTest.php and
# docs/Atproto-Compatibility.md §17.2.
#
# A job of its own, beside the Fediverse interop jobs, so it waits for none
# of their peers.

name: Interop against Bluesky

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:
  schedule:
    # Tuesdays, early, beside the other interop runs
    - cron: '23 4 * * 2'

permissions:
  contents: read

concurrency:
  group: interop-atproto-${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  interop-atproto:
    runs-on: ubuntu-latest
    name: Nextcloud Social ↔ Bluesky
    timeout-minutes: 45

    services:
      # what the development AppView, bsync and Ozone keep their index in
      postgres:
        image: postgres:14-alpine
        env:
          POSTGRES_USER: pg
          POSTGRES_PASSWORD: password
          POSTGRES_DB: postgres
        options: >-
          --health-cmd "pg_isready -U pg"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
        ports:
          - 5433:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 6380:6379

    env:
      APP_NAME: social
      NEXTCLOUD_URL: https://nextcloud.test
      NEXTCLOUD_USER: admin
      NEXTCLOUD_PASSWORD: admin
      # The relay refuses to crawl a loopback or private address and insists
      # on port 443, so the app answers on one globally routed address that
      # this runner, and only this runner, puts on its loopback.
      FEDERATION_IP: 100.128.0.10
      # the official relay, pinned by commit: a moved tag would change what
      # is being tested without a commit here saying so
      RELAY_IMAGE: ghcr.io/bluesky-social/indigo:relay-ae9297b7d0f4b61f778306aedbdf72b346d6f234
      ATPROTO_NETWORK_FILE: /tmp/atproto-network.json
      ATPROTO_VIDEO: /tmp/atproto-video.mp4
      DB_POSTGRES_URL: postgresql://pg:password@127.0.0.1:5433/postgres
      REDIS_HOST: 127.0.0.1:6380

    steps:
      - name: Checkout server
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: true
          repository: nextcloud/server
          ref: master

      - name: Checkout app
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: apps/social

      - name: Set up php
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          extensions: bz2, ctype, curl, dom, fileinfo, gd, iconv, intl, json, libxml, mbstring, openssl, pcntl, posix, session, simplexml, xmlreader, xmlwriter, zip, zlib, sqlite, pdo_sqlite
          coverage: none
          ini-file: development

      - name: Set up node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Make a test video
        # two seconds of H.264 in an MP4, the kind Bluesky's video service takes
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends ffmpeg
          ffmpeg -loglevel error -y -f lavfi -i testsrc=duration=2:size=320x240:rate=15 \
            -c:v libx264 -pix_fmt yuv420p -movflags +faststart "$ATPROTO_VIDEO"

      - name: Set up the app's PHP dependencies
        working-directory: apps/social
        run: composer i --no-dev

      - name: Give the server a name, an address and a certificate
        # The handle hosts are *.nextcloud.test; the certificate covers them,
        # and the development network's handle probe names the handle in the
        # query rather than needing a wildcard DNS entry the runner cannot have.
        run: |
          set -euo pipefail
          sudo ip addr add "$FEDERATION_IP/32" dev lo
          echo "$FEDERATION_IP nextcloud.test" | sudo tee -a /etc/hosts
          # a domain a person owns, for a custom handle (served by the network script)
          echo "$FEDERATION_IP me.handles.test" | sudo tee -a /etc/hosts
          mkdir -p /tmp/tls && cd /tmp/tls
          openssl req -x509 -newkey rsa:2048 -nodes -days 2 -subj '/CN=Interop CA' \
            -keyout ca.key -out ca.crt \
            -addext 'basicConstraints=critical,CA:true' -addext 'keyUsage=critical,keyCertSign,cRLSign'
          openssl req -newkey rsa:2048 -nodes -subj '/CN=nextcloud.test' -keyout nc.key -out nc.csr
          printf 'subjectAltName=DNS:nextcloud.test,DNS:*.nextcloud.test,DNS:me.handles.test\nextendedKeyUsage=serverAuth\n' > nc.ext
          openssl x509 -req -in nc.csr -CA ca.crt -CAkey ca.key -CAcreateserial -days 2 \
            -extfile nc.ext -out nc.crt
          chmod 644 nc.key
          sudo cp ca.crt /usr/local/share/ca-certificates/interop-ca.crt
          sudo update-ca-certificates

      - name: Set up Nextcloud
        run: |
          mkdir data
          ./occ maintenance:install --verbose --database=sqlite --database-name=nextcloud \
            --admin-user "$NEXTCLOUD_USER" --admin-pass "$NEXTCLOUD_PASSWORD"
          ./occ app:enable --force social
          ./occ config:system:set trusted_domains 1 --value localhost:8080
          ./occ config:system:set trusted_domains 2 --value nextcloud.test
          ./occ config:system:set trusted_domains 3 --value '*.nextcloud.test'
          ./occ config:system:set overwriteprotocol --value https
          ./occ config:system:set overwritehost --value nextcloud.test
          ./occ security:certificates:import /tmp/tls/ca.crt
          ./occ config:system:set overwrite.cli.url --value "$NEXTCLOUD_URL"
          ./occ config:app:set social cloud_url --value "$NEXTCLOUD_URL"
          ./occ config:app:set social social_url --value "$NEXTCLOUD_URL/index.php/apps/social/"
          # the directory, the AppView and the relay are all on this runner
          ./occ config:system:set allow_local_remote_servers --value true --type boolean
          ./occ config:app:set social atproto_plc_directory --value http://127.0.0.1:2582
          ./occ config:app:set social atproto_appview --value http://127.0.0.1:2584
          ./occ config:app:set social atproto_relays --value '["http://127.0.0.1:2470"]'
          ./occ config:app:set social atproto_enabled --value 1
          ./occ config:system:set auth.bruteforce.protection.enabled --value false --type boolean
          ./occ config:system:set ratelimit.protection.enabled --value false --type boolean
          ./occ log:manage --level=info

      - name: Run Nextcloud
        run: |
          PHP_CLI_SERVER_WORKERS=8 php -S localhost:8080 &
          cat > /tmp/tls/Caddyfile <<'CADDY'
          {
            admin off
            auto_https disable_redirects
          }
          nextcloud.test:443 {
            tls /tls/nc.crt /tls/nc.key
            log
            # the firehose is the daemon's WebSocket, in a handle block of its
            # own: Caddy runs every rewrite before any reverse_proxy, so a
            # plain /xrpc/* rewrite beside it would catch this path first.
            # Every other XRPC method and the well-known documents are routes
            # of index.php, as the root rules in contrib/webserver make them
            # under Apache and nginx
            handle /xrpc/com.atproto.sync.subscribeRepos {
              reverse_proxy 127.0.0.1:8787
            }
            handle {
              @xrpc path /xrpc/*
              rewrite @xrpc /index.php/apps/social{path}
              @didjson path /.well-known/did.json
              rewrite @didjson /index.php/apps/social{path}
              @atprotodid path /.well-known/atproto-did
              rewrite @atprotodid /index.php/apps/social{path}
              # the client API and OAuth — the authorization server Bluesky
              # sign-in shares with it, and the PDS's protected resource
              # document — as the root rules make them
              @oauth path /api/* /oauth/* /.well-known/oauth-authorization-server /.well-known/oauth-protected-resource
              rewrite @oauth /index.php/apps/social{path}
              @wellknown path /.well-known/*
              rewrite @wellknown /index.php{path}
              reverse_proxy localhost:8080
            }
          }
          me.handles.test:443 {
            tls /tls/nc.crt /tls/nc.key
            reverse_proxy 127.0.0.1:2591
          }
          *.nextcloud.test:443 {
            tls /tls/nc.crt /tls/nc.key
            @atprotodid path /.well-known/atproto-did
            rewrite @atprotodid /index.php/apps/social{path}
            reverse_proxy localhost:8080
          }
          CADDY
          docker run -d --name proxy --network host -v /tmp/tls:/tls:ro caddy:2 \
            caddy run --config /tls/Caddyfile --adapter caddyfile
          for attempt in $(seq 1 30); do
            curl -sf https://nextcloud.test/status.php \
              && curl -sf https://nextcloud.test/xrpc/com.atproto.server.describeServer && exit 0
            sleep 2
          done
          docker logs proxy
          exit 1

      - name: Serve the firehose
        run: |
          nohup ./occ social:atproto:serve --bind 127.0.0.1:8787 > /tmp/firehose.log 2>&1 &
          # the daemon answers a plain request with a text body; the app's
          # own 426 is JSON, so matching the text proves the proxy reaches
          # the daemon rather than PHP
          for attempt in $(seq 1 15); do
            if curl -s https://nextcloud.test/xrpc/com.atproto.sync.subscribeRepos | grep -q '^Upgrade Required'; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/firehose.log
          exit 1

      - name: Start the Bluesky development network
        working-directory: apps/social/tests/Interop/atproto
        env:
          NODE_EXTRA_CA_CERTS: /tmp/tls/ca.crt
          SOCIAL_URL: https://nextcloud.test
          NETWORK_FILE: /tmp/atproto-network.json
        run: |
          npm install --no-audit --no-fund --no-package-lock
          nohup node network.mjs > /tmp/network.log 2>&1 &
          for attempt in $(seq 1 60); do
            if [ -f "$NETWORK_FILE" ]; then
              cat "$NETWORK_FILE"
              exit 0
            fi
            sleep 3
          done
          cat /tmp/network.log
          exit 1

      - name: Point the app at the dev AppView as the authenticated one too, and at the video service
        # the notifications of local accounts are asked for as the user,
        # with a token addressed to the AppView's DID
        run: |
          ./occ config:app:set social atproto_appview_auth --value http://127.0.0.1:2584
          ./occ config:app:set social atproto_appview_did --value "$(python3 -c 'import json; print(json.load(open("/tmp/atproto-network.json"))["bskyDid"])')"
          # the network's stand-in for Bluesky's video service
          ./occ config:app:set social atproto_video_service --value http://127.0.0.1:2590
          ./occ config:app:set social atproto_video_service_did --value did:web:video.interop.test
          # the root rules are in place (the proxy above), so the OAuth
          # discovery document names the root addresses Bluesky apps use
          ./occ config:app:set social client_api_root --value 1

      - name: Start the relay
        # The official relay, told to crawl this app. It verifies every
        # commit's signature and revision against the directory; a relay that
        # does not come up is reported and the test goes on without it.
        run: |
          docker run -d --name relay --network host \
            --add-host nextcloud.test:$FEDERATION_IP \
            -v /etc/ssl/certs/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro \
            -e RELAY_ADMIN_PASSWORD=localdev -e RELAY_PLC_HOST=http://127.0.0.1:2582 \
            -e RELAY_ALLOW_INSECURE_HOSTS=true -e RELAY_API_BIND=:2470 \
            "$RELAY_IMAGE" /relay serve || { echo 'relay did not start'; exit 0; }
          for attempt in $(seq 1 20); do
            curl -sf http://127.0.0.1:2470/xrpc/_health && break
            sleep 2
          done
          if ./apps/social/../../occ social:atproto:crawl; then
            echo "ATPROTO_RELAY_URL=http://127.0.0.1:2470" >> "$GITHUB_ENV"
          else
            echo 'the relay refused the crawl request; the test runs without it'
            docker logs relay 2>&1 | tail -20
          fi

      - name: Give the existing accounts their identities
        run: ./occ social:atproto:identities

      - name: Interop tests
        working-directory: apps/social
        run: |
          composer i
          timeout 1200 php -d memory_limit=1G vendor/bin/phpunit -c tests/Interop/phpunit.xml --filter 'AtprotoVisibleTest|AtprotoReadingTest|AtprotoThreadsTest|AtprotoModerationTest|AtprotoAppsTest|AtprotoVideoTest|AtprotoOAuthTest|AtprotoHandleTest|AtprotoMoveAwayTest|AtprotoMoveInTest|AtprotoMoveByToolTest|AtprotoLinkCardTest|AtprotoThreadgateTest|AtprotoFeedsTest|AtprotoPostgateTest|AtprotoStarterPackTest|AtprotoBellTest|AtprotoChatTest|AtprotoBlocksTest|AtprotoReplyRuleTest|AtprotoDetachQuoteTest|AtprotoProfileRowsTest'

      - name: What each side saw, when it went wrong
        if: failure()
        run: |
          echo '--- Nextcloud log, notices and worse ---'
          python3 -c 'import json,sys
          for l in open("data/nextcloud.log"):
              try: d=json.loads(l)
              except Exception: continue
              m=d.get("message","")
              if d.get("level",0)>=1 and "headers already sent" not in m: print(d.get("time"),d.get("level"),d.get("app"),m[:300])' | tail -150 || true
          echo '--- firehose daemon ---'
          cat /tmp/firehose.log || true
          echo '--- development network ---'
          tail -150 /tmp/network.log || true
          echo '--- relay ---'
          docker logs relay 2>&1 | tail -60 || true
          echo '--- identities ---'
          ./occ social:atproto:identities --list || true
          echo '--- proxy ---'
          docker logs proxy 2>&1 | tail -40 || true
