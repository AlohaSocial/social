# The pull half of the translation sync: brings finished translations back
# from Transifex and converts them into the `l10n/*.js` / `l10n/*.json` files
# the app actually loads.
#
# Opens a pull request rather than committing to the default branch, so the
# diff is reviewed like any other. Does nothing at all when
# TRANSIFEX_API_TOKEN is unset — which is the state that made issue #1988 look
# like "translations are paused".
#
# SPDX-FileCopyrightText: 2026 Nextcloud GmbH and Nextcloud contributors
# SPDX-License-Identifier: MIT

name: l10n sync

on:
  schedule:
    # Mondays, early: a week's worth of translations at a time.
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

env:
  TRANSLATIONTOOL_REF: 5ed96fa6f9535415f9da1e672f38d7f7c659b2ee
  TRANSLATIONTOOL_SHA256: 667ca0a3d7ca8858f66f72007792d5bbab867dba6b1bb458d95ec7a74f17385f
  TX_CLI_VERSION: v1.6.17
  TX_CLI_SHA256: 002dec5b9e71248a7e6a0808118e9da940205828d5a33ce88e04bb57a967164d

jobs:
  pull:
    runs-on: ubuntu-latest

    name: pull translations

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Check the token is configured
        id: token
        env:
          TX_TOKEN: ${{ secrets.TRANSIFEX_API_TOKEN }}
        run: |
          if [ -z "$TX_TOKEN" ]; then
            echo "::notice::TRANSIFEX_API_TOKEN is not set: nothing to pull."
            echo "configured=false" >> $GITHUB_OUTPUT
          else
            echo "configured=true" >> $GITHUB_OUTPUT
          fi

      - name: Checkout
        if: steps.token.outputs.configured == 'true'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up php8.3
        if: steps.token.outputs.configured == 'true'
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: 8.3
          extensions: ctype, dom, json, libxml, mbstring, simplexml, xmlreader, xmlwriter
          coverage: none
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install gettext
        if: steps.token.outputs.configured == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gettext

      - name: Fetch the tools
        if: steps.token.outputs.configured == 'true'
        run: |
          curl -fsSL -o translationtool.phar \
            "https://raw.githubusercontent.com/nextcloud/docker-ci/$TRANSLATIONTOOL_REF/translations/translationtool/translationtool.phar"
          echo "$TRANSLATIONTOOL_SHA256  translationtool.phar" | sha256sum -c -

          curl -fsSL -o tx.tar.gz \
            "https://github.com/transifex/cli/releases/download/$TX_CLI_VERSION/tx-linux-amd64.tar.gz"
          echo "$TX_CLI_SHA256  tx.tar.gz" | sha256sum -c -
          tar -xzf tx.tar.gz tx

      - name: Pull translations and convert them
        if: steps.token.outputs.configured == 'true'
        env:
          TX_TOKEN: ${{ secrets.TRANSIFEX_API_TOKEN }}
        run: |
          # tx writes translationfiles/<lang>/social.po, per .tx/config
          ./tx pull --all --minimum-perc 25
          php translationtool.phar convert-po-files

      - name: Open a pull request when anything changed
        if: steps.token.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # translationfiles/ is the extractor's scratch space, never committed
          rm -rf translationfiles
          if [ -z "$(git status --porcelain -- l10n/)" ]; then
            echo "No new translations."
            exit 0
          fi

          branch="l10n/sync-$(date -u +%Y%m%d)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b "$branch"
          git add l10n/
          git commit -m 'chore(l10n): sync translations from Transifex'
          git push --force origin "$branch"

          if [ -z "$(gh pr list --head "$branch" --json number --jq '.[].number')" ]; then
            gh pr create --head "$branch" \
              --title 'chore(l10n): sync translations from Transifex' \
              --body 'Automated translation sync. Generated by `.github/workflows/l10n-pull.yml`; do not edit `l10n/` by hand.'
          fi
