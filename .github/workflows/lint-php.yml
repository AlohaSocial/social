name: Lint php

# A pull request and a push lint under the oldest PHP info.xml claims, the one
# that refuses syntax the app may not use yet. The nightly run, a manual run
# and the `full-ci` label (labelled-ci.yml) lint under every PHP of the matrix.
on:
  pull_request:
  push:
    branches:
      - main
      - stable*
  schedule:
    - cron: '39 21 * * *'
  workflow_dispatch:
  workflow_call:
    inputs:
      full:
        description: 'Lint under every PHP of the matrix'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  # per event, so a push cannot replace a pending nightly run, and apart from
  # the pull request's own run when labelled-ci.yml calls this one
  group: lint-php-${{ inputs.full && 'full' || github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      php-versions: ${{ steps.php.outputs.php-versions }}
    steps:
      - name: Checkout app
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Get version matrix
        id: versions
        uses: icewind1991/nextcloud-version-matrix@cd0211ffcef1065e2020cd579e4843b8746e7a58 # v1.3.3
      - name: Pick the PHP versions
        id: php
        env:
          VERSIONS: ${{ steps.versions.outputs.php-versions }}
          FULL: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || inputs.full == true }}
        run: |
          if [ "$FULL" = true ]; then
            versions=$(echo "$VERSIONS" | jq -c .)
          else
            min=$(grep -oP 'php min-version="\K[^"]+' appinfo/info.xml)
            versions=$(jq -nc --arg php "$min" '[$php]')
          fi
          echo "Linting under PHP $versions"
          echo "php-versions=$versions" >> "$GITHUB_OUTPUT"

  php-lint:
    runs-on: ubuntu-latest
    needs: matrix
    strategy:
      matrix:
        php-versions: ${{fromJson(needs.matrix.outputs.php-versions)}}

    name: php-lint

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The matrix is built from the Nextcloud range, so a server that still
      # supports an older PHP puts that PHP here even though info.xml does not
      # claim it. The PHPUnit workflows already skip such a leg for exactly
      # this reason; without the same guard, `php -l` reads the whole tree
      # under a PHP this app never claimed and fails on syntax it is entitled
      # to use.
      - name: Check PHP version requirement
        id: php_check
        run: |
          PHP_MIN=$(grep -oP 'php min-version="\K[^"]+' appinfo/info.xml)
          echo "App requires PHP >= $PHP_MIN, current is ${{ matrix.php-versions }}"
          if php -r "exit(version_compare('${{ matrix.php-versions }}', '$PHP_MIN') < 0 ? 1 : 0);"; then
            echo "PHP version ${{ matrix.php-versions }} meets minimum requirement $PHP_MIN"
          else
            echo "PHP version ${{ matrix.php-versions }} is below minimum $PHP_MIN, skipping"
            echo "skip=true" >> $GITHUB_OUTPUT
          fi

      - name: Set up php ${{ matrix.php-versions }}
        if: steps.php_check.outputs.skip != 'true'
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php-versions }}
          extensions: bz2, ctype, curl, dom, fileinfo, gd, iconv, intl, json, libxml, mbstring, openssl, pcntl, posix, session, simplexml, xmlreader, xmlwriter, zip, zlib, sqlite, pdo_sqlite
          coverage: none
          ini-file: development
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint
        if: steps.php_check.outputs.skip != 'true'
        run: composer run lint

      - name: Skipped notification
        if: steps.php_check.outputs.skip == 'true'
        run: echo "PHP version ${{ matrix.php-versions }} is below app minimum, skipping"

  summary:
    permissions:
      contents: none
    runs-on: ubuntu-latest
    needs: php-lint

    if: always()

    name: php-lint-summary

    steps:
      - name: Summary status
        run: if ${{ needs.php-lint.result != 'success' }}; then exit 1; fi
