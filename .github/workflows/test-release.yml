#
# Manual DRY RUN: uses the same strict tests and Makefile build as a real release.
# Signs an Actions artifact but never publishes or modifies a GitHub Release
# and never sends anything to the Nextcloud App Store.

name: Test App Store Release (Dry Run)

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  APP_NAME: ${{ github.event.repository.name }}

jobs:
  test-release:
    name: Test, package and sign without publishing
    if: github.repository == 'AlohaSocial/social'
    runs-on: ubuntu-latest
    timeout-minutes: 90

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout selected branch or tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ${{ env.APP_NAME }}
          persist-credentials: false
          # the whole history and the tags: the changelog is generated from them
          fetch-depth: 0

      - name: Read Node.js and npm versions from package.json
        id: versions
        uses: skjnldsv/read-package-engines-version-actions@06d6db44aa62f4609ba070f556ec24bc99fb85cb # v4
        with:
          path: ${{ env.APP_NAME }}
          fallbackNode: '^20'
          fallbackNpm: '^10'

      - name: Set up Node.js ${{ steps.versions.outputs.nodeVersion }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.versions.outputs.nodeVersion }}
          cache: npm
          cache-dependency-path: ${{ env.APP_NAME }}/package-lock.json

      - name: Set up npm ${{ steps.versions.outputs.npmVersion }}
        env:
          NPM_VERSION: ${{ steps.versions.outputs.npmVersion }}
        run: npm install -g "npm@${NPM_VERSION}"

      # the app's own floor, as phpunit-sqlite.yml reads it: the version
      # matrix action's php-min is the oldest PHP the supported servers run
      # on, which was 8.2 while info.xml and PHPUnit 12 asked for 8.3
      - name: Read the minimum PHP version from info.xml
        id: php-versions
        run: |
          set -euo pipefail
          php_min="$(grep -oP 'php min-version="\K[^"]+' "${APP_NAME}/appinfo/info.xml")"
          if [[ ! "$php_min" =~ ^[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid php min-version in info.xml: $php_min"
            exit 1
          fi
          echo "php-min=$php_min" >> "$GITHUB_OUTPUT"

      - name: Set up PHP ${{ steps.php-versions.outputs.php-min }}
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ steps.php-versions.outputs.php-min }}
          tools: composer:v2
          coverage: none
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify all app versions are consistent
        run: |
          set -euo pipefail
          xml_version="$(php -r 'echo (string) simplexml_load_file(getenv("APP_NAME") . "/appinfo/info.xml")->version;')"
          npm_version="$(node -p 'require("./" + process.env.APP_NAME + "/package.json").version')"
          composer_version="$(php -r '$j=json_decode(file_get_contents(getenv("APP_NAME") . "/composer.json"), true); echo $j["version"];')"
          if [[ ! "$xml_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "::error::Invalid version in info.xml: $xml_version"
            exit 1
          fi
          if [[ "$xml_version" != "$npm_version" || "$xml_version" != "$composer_version" ]]; then
            echo "::error::Version mismatch: info.xml=$xml_version, package.json=$npm_version, composer.json=$composer_version"
            exit 1
          fi
          # Also check the release tag when the dry run targets a tag.
          if [[ "$GITHUB_REF_TYPE" == 'tag' && "${GITHUB_REF_NAME#v}" != "$xml_version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $xml_version"
            exit 1
          fi
          echo "Version $xml_version is consistent."

      - name: Install git-cliff
        env:
          GIT_CLIFF_VERSION: 2.14.2
          GIT_CLIFF_SHA256: 24f397c733add5390fdceee3a2088588ab0d5f944ce00d34cb7029b888cf2db4
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 3 \
            "https://github.com/orhun/git-cliff/releases/download/v${GIT_CLIFF_VERSION}/git-cliff-${GIT_CLIFF_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            -o "$RUNNER_TEMP/git-cliff.tar.gz"
          echo "${GIT_CLIFF_SHA256}  $RUNNER_TEMP/git-cliff.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/git-cliff.tar.gz" -C "$RUNNER_TEMP"
          sudo install "$RUNNER_TEMP/git-cliff-${GIT_CLIFF_VERSION}/git-cliff" /usr/local/bin/git-cliff
          git-cliff --version

      # CHANGELOG.md is what `make changelog` writes for this tree. On a tag a
      # stale one is an error; on a branch it is a warning that says what to
      # run before tagging, so the dry run can be made at any time.
      - name: Check CHANGELOG.md is generated for this tree
        working-directory: ${{ env.APP_NAME }}
        run: |
          set -euo pipefail
          make changelog
          if git diff --quiet -- CHANGELOG.md; then
            echo 'CHANGELOG.md is current.'
          elif [[ "$GITHUB_REF_TYPE" == 'tag' ]]; then
            git diff -- CHANGELOG.md | head -60
            echo '::error::CHANGELOG.md is not what `make changelog` generates for this tag: regenerate and commit it before tagging'
            exit 1
          else
            git diff --stat -- CHANGELOG.md
            echo '::warning::CHANGELOG.md is behind the commits: run `make changelog` and commit the result before tagging'
            git checkout -- CHANGELOG.md
          fi

      - name: Install JavaScript dependencies
        working-directory: ${{ env.APP_NAME }}
        env:
          CYPRESS_INSTALL_BINARY: '0'
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm ci

      - name: Run JavaScript unit tests
        working-directory: ${{ env.APP_NAME }}
        run: npm run test

      - name: Run JavaScript lint and type checks
        working-directory: ${{ env.APP_NAME }}
        run: |
          set -euo pipefail
          npm run lint
          npm run typecheck

      - name: Install PHP development dependencies for tests
        working-directory: ${{ env.APP_NAME }}
        run: bash .github/scripts/composer-install-retry.sh install --prefer-dist --no-interaction --no-progress

      - name: Run PHP unit tests and syntax checks
        working-directory: ${{ env.APP_NAME }}
        run: |
          set -euo pipefail
          composer run test:unit
          composer run lint

      - name: Build and package using Makefile (no Krankerl)
        working-directory: ${{ env.APP_NAME }}
        env:
          CYPRESS_INSTALL_BINARY: '0'
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: |
          set -euo pipefail
          make appstore
          test -s "build/artifacts/${APP_NAME}.tar.gz"

      - name: Download the minimum supported Nextcloud server for signing
        run: |
          set -euo pipefail
          nc_version="$(php -r 'echo (string) simplexml_load_file(getenv("APP_NAME") . "/appinfo/info.xml")->dependencies->nextcloud["min-version"];')"
          if [[ ! "$nc_version" =~ ^[0-9]+$ ]]; then
            echo '::error::Invalid Nextcloud minimum version in info.xml'
            exit 1
          fi
          curl --fail --location --silent --show-error --retry 3 \
            "https://download.nextcloud.com/server/releases/latest-${nc_version}.zip" \
            -o "$RUNNER_TEMP/nextcloud.zip"
          unzip -q "$RUNNER_TEMP/nextcloud.zip" -d "$GITHUB_WORKSPACE"
          test -f nextcloud/occ

      - name: Verify signing key, sign app and repackage
        env:
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "$APP_PRIVATE_KEY" ]]; then
            echo '::error::Missing repository secret APP_PRIVATE_KEY'
            exit 1
          fi
          umask 077
          key_dir="$(mktemp -d)"
          trap 'rm -rf "$key_dir"' EXIT
          printf '%s\n' "$APP_PRIVATE_KEY" > "$key_dir/${APP_NAME}.key"
          curl --fail --location --silent --show-error --retry 3 \
            "https://raw.githubusercontent.com/nextcloud/app-certificate-requests/master/${APP_NAME}/${APP_NAME}.crt" \
            -o "$key_dir/${APP_NAME}.crt"
          openssl pkey -in "$key_dir/${APP_NAME}.key" -pubout -out "$key_dir/key.pub"
          openssl x509 -in "$key_dir/${APP_NAME}.crt" -pubkey -noout -out "$key_dir/cert.pub"
          if ! cmp -s "$key_dir/key.pub" "$key_dir/cert.pub"; then
            echo '::error::App private key does not match the registered certificate'
            exit 1
          fi
          tar -xzf "${APP_NAME}/build/artifacts/${APP_NAME}.tar.gz" -C "${APP_NAME}/build/artifacts"
          php nextcloud/occ integrity:sign-app \
            --privateKey="$key_dir/${APP_NAME}.key" \
            --certificate="$key_dir/${APP_NAME}.crt" \
            --path="$GITHUB_WORKSPACE/${APP_NAME}/build/artifacts/${APP_NAME}"
          test -s "${APP_NAME}/build/artifacts/${APP_NAME}/appinfo/signature.json"
          tar -czf "${APP_NAME}/build/artifacts/${APP_NAME}.tar.gz" \
            -C "${APP_NAME}/build/artifacts" "$APP_NAME"
          tar -tzf "${APP_NAME}/build/artifacts/${APP_NAME}.tar.gz" \
            | grep -Fx "${APP_NAME}/appinfo/signature.json" > /dev/null

      - name: Upload signed package as temporary Actions artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aloha-social-signed-dry-run
          path: ${{ env.APP_NAME }}/build/artifacts/${{ env.APP_NAME }}.tar.gz
          if-no-files-found: error
          retention-days: 3

      - name: Dry run summary (publishing intentionally omitted)
        run: |
          {
            echo '## Aloha Social release dry run completed'
            echo ''
            echo '- Strict tests: passed'
            echo '- Signed archive: available under Actions artifacts'
            echo '- GitHub Release: NOT created or modified'
            echo '- Nextcloud App Store: NOT contacted'
          } >> "$GITHUB_STEP_SUMMARY"
