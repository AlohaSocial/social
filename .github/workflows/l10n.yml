# Translation source extraction, and the Transifex push half of the sync.
#
# Issue #1988 ("translations are paused") is a broken pipeline, not a paused
# one: nothing in this repository ever extracted the source strings, so
# nothing was ever pushed for translation. `l10n/de.json` — the best covered
# language — carries 135 strings against ~347 in the source.
#
# .tx/config is correct as it stands: `translationfiles/` is not a directory
# the repository holds, it is what the extractor below writes (the same layout
# every Nextcloud app uses, and what the Makefile's appstore target excludes).
#
# SPDX-FileCopyrightText: 2026 Nextcloud GmbH and Nextcloud contributors
# SPDX-License-Identifier: MIT

name: l10n

# A push to main extracts and pushes the source strings, as before. The
# extraction is checked nightly, by hand and on a pull request labelled
# `full-ci` (labelled-ci.yml) rather than on every pull request.
on:
  push:
    branches:
      - main
      - master
  schedule:
    - cron: '43 21 * * *'
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # per event, so a push cannot replace a pending nightly run
  group: l10n-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # nextcloud/docker-ci's translationtool: the tool the organisation's own
  # translation sync runs. Pinned to a commit, with its digest, because it is
  # an executable downloaded into CI.
  TRANSLATIONTOOL_REF: 5ed96fa6f9535415f9da1e672f38d7f7c659b2ee
  TRANSLATIONTOOL_SHA256: 667ca0a3d7ca8858f66f72007792d5bbab867dba6b1bb458d95ec7a74f17385f
  TX_CLI_VERSION: v1.6.17
  TX_CLI_SHA256: 002dec5b9e71248a7e6a0808118e9da940205828d5a33ce88e04bb57a967164d

jobs:
  extract:
    runs-on: ubuntu-latest

    name: extract source strings

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up php8.3
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: 8.3
          extensions: ctype, dom, json, libxml, mbstring, simplexml, xmlreader, xmlwriter
          coverage: none
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install gettext
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gettext

      - name: Fetch the translationtool
        run: |
          curl -fsSL -o translationtool.phar \
            "https://raw.githubusercontent.com/nextcloud/docker-ci/$TRANSLATIONTOOL_REF/translations/translationtool/translationtool.phar"
          echo "$TRANSLATIONTOOL_SHA256  translationtool.phar" | sha256sum -c -

      - name: Extract source strings
        run: |
          php translationtool.phar create-pot-files
          test -s translationfiles/templates/social.pot

      - name: Report translation coverage
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob, json, os, re

          pot = open('translationfiles/templates/social.pot', encoding='utf-8').read()
          # every msgid but the header's empty one
          source = {m for m in re.findall(r'^msgid "((?:[^"\\]|\\.)*)"', pot, re.M) if m}
          total = len(source)
          print(f'## Translation coverage\n')
          print(f'`{total}` translatable strings in the source.\n')
          print('| Language | Translated | Coverage |')
          print('|---|---:|---:|')
          rows = []
          for path in sorted(glob.glob('l10n/*.json')):
              with open(path, encoding='utf-8') as handle:
                  done = {k: v for k, v in json.load(handle)['translations'].items() if v}
              rows.append((len(done), os.path.basename(path)[:-5]))
          for count, lang in sorted(rows, reverse=True)[:15]:
              print(f'| {lang} | {count} | {100 * count // max(total, 1)}% |')
          print(f'\n{len(rows)} languages present in `l10n/`.')
          PY

      - name: Upload the extracted template
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: social-pot
          path: translationfiles/templates/social.pot
          if-no-files-found: error

      # Scheduled and called workflows verify extraction only. Upload source
      # strings only after a push to the repository's current default branch.
      # A fork or repository without the token simply has nothing to push.
      - name: Push source strings to Transifex
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          TX_TOKEN: ${{ secrets.TRANSIFEX_API_TOKEN }}
        run: |
          if [ -z "$TX_TOKEN" ]; then
            echo "::notice::TRANSIFEX_API_TOKEN is not set, so the source strings were extracted but not pushed."
            echo "Add the secret (or register this app with the organisation's translation sync) to resume translation."
            exit 0
          fi

          curl -fsSL -o tx.tar.gz \
            "https://github.com/transifex/cli/releases/download/$TX_CLI_VERSION/tx-linux-amd64.tar.gz"
          echo "$TX_CLI_SHA256  tx.tar.gz" | sha256sum -c -
          tar -xzf tx.tar.gz tx
          ./tx push --source --use-git-timestamps
