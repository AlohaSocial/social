# https://github.com/nextcloud/.github
#
# SPDX-FileCopyrightText: 2021-2024 Nextcloud GmbH and Nextcloud contributors
# SPDX-FileCopyrightText: 2026 AlohaSocial contributors
# SPDX-License-Identifier: MIT
#
# Requires:
# - Repository secret: APP_PRIVATE_KEY
# - Environment "nextcloud-appstore" with Required reviewers enabled
# - Environment secret in "nextcloud-appstore": APPSTORE_TOKEN
# Without Required reviewers, an environment alone will NOT pause deployment.
# Stable AND pre-releases (e.g. v1.2.3-beta.1) are supported.

name: Build and publish app release

on:
  release:
    types: [published]

permissions:
  contents: read

env:
  # Dynamically use the repository name as the Nextcloud app ID.
  APP_NAME: ${{ github.event.repository.name }}

concurrency:
  group: appstore-release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build_and_publish:
    name: Test, build, sign and attach release
    if: github.repository == 'AlohaSocial/social'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    outputs:
      download_url: ${{ steps.attach_to_release.outputs.browser_download_url }}

    defaults:
      run:
        shell: bash

    steps:
      - name: Check release actor permission
        uses: skjnldsv/check-actor-permission@69e92a3c4711150929bca9fcf34448c5bf5526e7 # v3.0
        with:
          require: write

      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ${{ env.APP_NAME }}
          persist-credentials: false

      - name: Read Node.js and npm versions from package.json
        id: versions
        uses: skjnldsv/read-package-engines-version-actions@06d6db44aa62f4609ba070f556ec24bc99fb85cb # v4
        with:
          path: ${{ env.APP_NAME }}
          fallbackNode: '^20'
          fallbackNpm: '^10'

      - name: Set up Node.js ${{ steps.versions.outputs.nodeVersion }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.versions.outputs.nodeVersion }}
          cache: npm
          cache-dependency-path: ${{ env.APP_NAME }}/package-lock.json

      - name: Set up npm ${{ steps.versions.outputs.npmVersion }}
        env:
          NPM_VERSION: ${{ steps.versions.outputs.npmVersion }}
        run: npm install -g "npm@${NPM_VERSION}"

      # the app's own floor, as phpunit-sqlite.yml and the dry run read it:
      # the version matrix action's php-min is the oldest PHP the supported
      # servers run on, which was 8.2 while info.xml and PHPUnit 12 asked for 8.3
      - name: Read the minimum PHP version from info.xml
        id: php-versions
        run: |
          set -euo pipefail
          php_min="$(grep -oP 'php min-version="\K[^"]+' "${APP_NAME}/appinfo/info.xml")"
          if [[ ! "$php_min" =~ ^[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid php min-version in info.xml: $php_min"
            exit 1
          fi
          echo "php-min=$php_min" >> "$GITHUB_OUTPUT"

      - name: Set up PHP ${{ steps.php-versions.outputs.php-min }}
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ steps.php-versions.outputs.php-min }}
          tools: composer:v2
          coverage: none
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify release tag matches all app versions
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          xml_version="$(php -r 'echo (string) simplexml_load_file(getenv("APP_NAME") . "/appinfo/info.xml")->version;')"
          npm_version="$(node -p 'require("./" + process.env.APP_NAME + "/package.json").version')"
          composer_version="$(php -r '$j=json_decode(file_get_contents(getenv("APP_NAME") . "/composer.json"), true); echo $j["version"];')"
          # Nextcloud App Store expects SemVer without build metadata.
          if [[ ! "$tag_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "::error::Invalid release tag: ${GITHUB_REF_NAME} (use vX.Y.Z or vX.Y.Z-beta.1)"
            exit 1
          fi
          if [[ "$tag_version" != "$xml_version" || "$tag_version" != "$npm_version" || "$tag_version" != "$composer_version" ]]; then
            echo "::error::Version mismatch: tag=$tag_version, info.xml=$xml_version, package.json=$npm_version, composer.json=$composer_version"
            exit 1
          fi
          echo "Release version ${tag_version} is consistent."

      - name: Install JavaScript dependencies
        working-directory: ${{ env.APP_NAME }}
        env:
          CYPRESS_INSTALL_BINARY: '0'
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm ci

      - name: Run JavaScript unit tests
        working-directory: ${{ env.APP_NAME }}
        run: npm run test

      - name: Run JavaScript lint and type checks
        working-directory: ${{ env.APP_NAME }}
        run: |
          set -euo pipefail
          npm run lint
          npm run typecheck

      - name: Install PHP development dependencies for tests
        working-directory: ${{ env.APP_NAME }}
        run: bash .github/scripts/composer-install-retry.sh install --prefer-dist --no-interaction --no-progress

      - name: Run PHP unit tests and syntax checks
        working-directory: ${{ env.APP_NAME }}
        run: |
          set -euo pipefail
          composer run test:unit
          composer run lint

      - name: Build and package using Makefile (no Krankerl)
        working-directory: ${{ env.APP_NAME }}
        env:
          CYPRESS_INSTALL_BINARY: '0'
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: |
          set -euo pipefail
          # make appstore installs production dependencies, builds and packages.
          make appstore
          test -s "build/artifacts/${APP_NAME}.tar.gz"

      - name: Download the minimum supported Nextcloud server for signing
        run: |
          set -euo pipefail
          nc_version="$(php -r 'echo (string) simplexml_load_file(getenv("APP_NAME") . "/appinfo/info.xml")->dependencies->nextcloud["min-version"];')"
          if [[ ! "$nc_version" =~ ^[0-9]+$ ]]; then
            echo '::error::Invalid Nextcloud minimum version in info.xml'
            exit 1
          fi
          curl --fail --location --silent --show-error --retry 3 \
            "https://download.nextcloud.com/server/releases/latest-${nc_version}.zip" \
            -o "$RUNNER_TEMP/nextcloud.zip"
          unzip -q "$RUNNER_TEMP/nextcloud.zip" -d "$GITHUB_WORKSPACE"
          test -f nextcloud/occ

      - name: Verify signing key, sign app and repackage
        env:
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "$APP_PRIVATE_KEY" ]]; then
            echo '::error::Missing repository secret APP_PRIVATE_KEY'
            exit 1
          fi
          umask 077
          key_dir="$(mktemp -d)"
          trap 'rm -rf "$key_dir"' EXIT
          printf '%s\n' "$APP_PRIVATE_KEY" > "$key_dir/${APP_NAME}.key"
          curl --fail --location --silent --show-error --retry 3 \
            "https://raw.githubusercontent.com/nextcloud/app-certificate-requests/master/${APP_NAME}/${APP_NAME}.crt" \
            -o "$key_dir/${APP_NAME}.crt"
          openssl pkey -in "$key_dir/${APP_NAME}.key" -pubout -out "$key_dir/key.pub"
          openssl x509 -in "$key_dir/${APP_NAME}.crt" -pubkey -noout -out "$key_dir/cert.pub"
          if ! cmp -s "$key_dir/key.pub" "$key_dir/cert.pub"; then
            echo '::error::App private key does not match the registered certificate'
            exit 1
          fi
          tar -xzf "${APP_NAME}/build/artifacts/${APP_NAME}.tar.gz" -C "${APP_NAME}/build/artifacts"
          php nextcloud/occ integrity:sign-app \
            --privateKey="$key_dir/${APP_NAME}.key" \
            --certificate="$key_dir/${APP_NAME}.crt" \
            --path="$GITHUB_WORKSPACE/${APP_NAME}/build/artifacts/${APP_NAME}"
          test -s "${APP_NAME}/build/artifacts/${APP_NAME}/appinfo/signature.json"
          tar -czf "${APP_NAME}/build/artifacts/${APP_NAME}.tar.gz" \
            -C "${APP_NAME}/build/artifacts" "$APP_NAME"
          tar -tzf "${APP_NAME}/build/artifacts/${APP_NAME}.tar.gz" \
            | grep -Fx "${APP_NAME}/appinfo/signature.json" > /dev/null

      - name: Attach signed tarball to GitHub release
        id: attach_to_release
        uses: svenstaro/upload-release-action@29e53e917877a24fad85510ded594ab3c9ca12de # 2.11.5
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ${{ env.APP_NAME }}/build/artifacts/${{ env.APP_NAME }}.tar.gz
          asset_name: ${{ env.APP_NAME }}-${{ github.event.release.tag_name }}.tar.gz
          tag: ${{ github.event.release.tag_name }}
          overwrite: true

      - name: Summarize successful build
        env:
          RELEASE_ASSET_URL: ${{ steps.attach_to_release.outputs.browser_download_url }}
        run: |
          set -euo pipefail
          if [[ -z "$RELEASE_ASSET_URL" ]]; then
            echo '::error::GitHub Release asset URL is empty'
            exit 1
          fi
          {
            echo '## Signed release ready for manual approval'
            echo ''
            echo '- All mandatory tests: passed'
            echo '- Package: built, signed and attached to GitHub Release'
            echo "- [Download release archive]($RELEASE_ASSET_URL)"
            echo '- Next: approve the `nextcloud-appstore` deployment'
          } >> "$GITHUB_STEP_SUMMARY"

  publish_appstore:
    name: Publish to Nextcloud App Store (manual approval)
    needs: build_and_publish
    if: github.repository == 'AlohaSocial/social'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    environment:
      name: nextcloud-appstore

    steps:
      # This entire job waits for environment approval, including the secrets.
      - name: Verify App Store secrets and release URL
        shell: bash
        env:
          APPSTORE_TOKEN: ${{ secrets.APPSTORE_TOKEN }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          DOWNLOAD_URL: ${{ needs.build_and_publish.outputs.download_url }}
        run: |
          set -euo pipefail
          if [[ -z "$APPSTORE_TOKEN" || -z "$APP_PRIVATE_KEY" || -z "$DOWNLOAD_URL" ]]; then
            echo '::error::APPSTORE_TOKEN, APP_PRIVATE_KEY or release URL is missing'
            exit 1
          fi

      - name: Upload app to Nextcloud App Store
        uses: nextcloud-releases/nextcloud-appstore-push-action@a011fe619bcf6e77ddebc96f9908e1af4071b9c1 # v1.0.3
        with:
          app_name: ${{ env.APP_NAME }}
          appstore_token: ${{ secrets.APPSTORE_TOKEN }}
          download_url: ${{ needs.build_and_publish.outputs.download_url }}
          app_private_key: ${{ secrets.APP_PRIVATE_KEY }}
