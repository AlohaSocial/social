name: PHPUnit SQLite

# A pull request and a push run two legs: the newest stable server and the
# coverage leg (below), each on the newest PHP. The nightly run, a manual run
# and the `full-ci` label (labelled-ci.yml) run the whole matrix.
on:
  pull_request:
  push:
    branches:
      - main
      - stable*
  schedule:
    - cron: '3 21 * * *'
  workflow_dispatch:
  workflow_call:
    inputs:
      full:
        description: 'Run the whole matrix'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  # per event, so a push cannot replace a pending nightly run, and apart from
  # the pull request's own run when labelled-ci.yml calls this one
  group: phpunit-sqlite-${{ inputs.full && 'full' || github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      # sparse-matrix covers the whole range info.xml claims (both the min and
      # the max server version) with minimal redundancy; branches-max-list
      # tested the newest server only, so the claimed floor went unexercised.
      matrix: ${{ steps.legs.outputs.matrix }}
      # the one leg that measures coverage: the newest server, on the newest
      # PHP the matrix runs it with
      coverage-server: ${{ steps.coverage.outputs.server }}
      coverage-php: ${{ steps.coverage.outputs.php }}
    steps:
      - name: Checkout app
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get version matrix
        id: versions
        uses: icewind1991/nextcloud-version-matrix@cd0211ffcef1065e2020cd579e4843b8746e7a58 # v1.3.3

      - name: Pick the coverage leg
        id: coverage
        env:
          MATRIX: ${{ steps.versions.outputs.sparse-matrix }}
          SERVER: ${{ steps.versions.outputs.branches-max }}
        run: |
          php=$(echo "$MATRIX" | jq -r --arg server "$SERVER" \
            '[.include[] | select(."server-versions" == $server) | ."php-versions"] | max_by(split(".") | map(tonumber))')
          echo "Coverage is measured on PHP $php with Nextcloud $SERVER"
          echo "server=$SERVER" >> "$GITHUB_OUTPUT"
          echo "php=$php" >> "$GITHUB_OUTPUT"

      - name: Pick the legs
        id: legs
        env:
          MATRIX: ${{ steps.versions.outputs.sparse-matrix }}
          FULL: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || inputs.full == true }}
          COVERAGE_SERVER: ${{ steps.coverage.outputs.server }}
        run: |
          if [ "$FULL" = true ]; then
            matrix=$(echo "$MATRIX" | jq -c .)
          else
            # the newest stable server, and the coverage leg
            extra=$(jq -nc --arg server "$COVERAGE_SERVER" '[$server]')
            matrix=$(echo "$MATRIX" | jq -c --argjson extra "$extra" -f .github/scripts/pull-request-legs.jq)
          fi
          echo "$matrix" | jq .
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  changes:
    runs-on: ubuntu-latest
    # the scheduled and the manual run test everything; the filter has no
    # pull request or push to compare with there
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    permissions:
      contents: read
      pull-requests: read

    outputs:
      src: ${{ steps.changes.outputs.src}}

    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: changes
        continue-on-error: true
        with:
          filters: |
            src:
              - '.github/workflows/**'
              - 'appinfo/**'
              - 'lib/**'
              - 'templates/**'
              - 'tests/**'
              - 'vendor/**'
              - 'vendor-bin/**'
              - '.php-cs-fixer.dist.php'
              - 'composer.json'
              - 'composer.lock'
              - 'docs/**'
              - 'README.md'

  phpunit-sqlite:
    runs-on: ubuntu-latest

    needs: [changes, matrix]
    # !cancelled(): `changes` is skipped on the scheduled and the manual run
    if: ${{ !cancelled() && needs.matrix.result == 'success' && needs.changes.outputs.src != 'false' }}

    strategy:
      matrix: ${{ fromJson(needs.matrix.outputs.matrix) }}

    name: SQLite PHP ${{ matrix.php-versions }} Nextcloud ${{ matrix.server-versions }}

    env:
      COVERAGE: ${{ matrix.server-versions == needs.matrix.outputs.coverage-server && matrix.php-versions == needs.matrix.outputs.coverage-php }}

    steps:
      - name: Set app env
        run: |
          # Split and keep last
          echo "APP_NAME=${GITHUB_REPOSITORY##*/}" >> $GITHUB_ENV

      - name: Checkout server
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          repository: nextcloud/server
          ref: ${{ matrix.server-versions }}

      - name: Checkout app
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: apps/${{ env.APP_NAME }}

      - name: Check PHP version requirement
        id: php_check
        run: |
          PHP_MIN=$(grep -oP 'php min-version="\K[^"]+' apps/${{ env.APP_NAME }}/appinfo/info.xml)
          echo "App requires PHP >= $PHP_MIN, current is ${{ matrix.php-versions }}"
          if php -r "exit(version_compare('${{ matrix.php-versions }}', '$PHP_MIN') < 0 ? 1 : 0);"; then
            echo "PHP version ${{ matrix.php-versions }} meets minimum requirement $PHP_MIN"
          else
            echo "PHP version ${{ matrix.php-versions }} is below minimum $PHP_MIN, skipping"
            echo "skip=true" >> $GITHUB_OUTPUT
          fi

      - name: Set up php ${{ matrix.php-versions }}
        if: steps.php_check.outputs.skip != 'true'
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php-versions }}
          # https://docs.nextcloud.com/server/stable/admin_manual/installation/source_installation.html#prerequisites-for-manual-installation
          extensions: bz2, ctype, curl, dom, fileinfo, gd, iconv, intl, json, libxml, mbstring, openssl, pcntl, posix, session, simplexml, xmlreader, xmlwriter, zip, zlib, sqlite, pdo_sqlite
          coverage: ${{ env.COVERAGE == 'true' && 'pcov' || 'none' }}
          ini-file: development
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check composer file existence
        if: steps.php_check.outputs.skip != 'true'
        id: check_composer
        uses: andstor/file-existence-action@558493d6c74bf472d87c84eab196434afc2fa029 # v3.1.0
        with:
          files: apps/${{ env.APP_NAME }}/composer.json

      - name: Set up dependencies
        # Only run if phpunit config file exists
        if: steps.php_check.outputs.skip != 'true' && steps.check_composer.outputs.files_exists == 'true'
        working-directory: apps/${{ env.APP_NAME }}
        run: bash .github/scripts/composer-install-retry.sh install --no-interaction --no-progress --prefer-dist

      - name: Set up Nextcloud
        if: steps.php_check.outputs.skip != 'true'
        env:
          DB_PORT: 4444
        run: |
          mkdir data
          ./occ maintenance:install --verbose --database=sqlite --database-name=nextcloud --database-host=127.0.0.1 --database-port=$DB_PORT --database-user=root --database-pass=rootpassword --admin-user admin --admin-pass admin
          ./occ app:enable --force ${{ env.APP_NAME }}

      - name: Check PHPUnit script is defined
        if: steps.php_check.outputs.skip != 'true'
        id: check_phpunit
        continue-on-error: true
        working-directory: apps/${{ env.APP_NAME }}
        run: |
          composer run --list | grep '^  test:unit ' | wc -l | grep 1

      - name: PHPUnit
        # Only run if phpunit config file exists
        if: steps.php_check.outputs.skip != 'true' && steps.check_phpunit.outcome == 'success' && env.COVERAGE != 'true'
        working-directory: apps/${{ env.APP_NAME }}
        run: composer run test:unit

      - name: PHPUnit with coverage
        if: steps.php_check.outputs.skip != 'true' && steps.check_phpunit.outcome == 'success' && env.COVERAGE == 'true'
        working-directory: apps/${{ env.APP_NAME }}
        run: |
          php -d memory_limit=1G -d pcov.directory="$PWD/lib" vendor/bin/phpunit -c tests/phpunit.xml \
            --coverage-clover coverage/php/unit.xml

      - name: Check PHPUnit integration script is defined
        if: steps.php_check.outputs.skip != 'true'
        id: check_integration
        continue-on-error: true
        working-directory: apps/${{ env.APP_NAME }}
        run: |
          composer run --list | grep '^  test:integration ' | wc -l | grep 1

      - name: Run Nextcloud
        # Only run if phpunit integration config file exists
        if: steps.php_check.outputs.skip != 'true' && steps.check_integration.outcome == 'success'
        run: php -S localhost:8080 &

      - name: PHPUnit integration
        # Only run if phpunit integration config file exists
        if: steps.php_check.outputs.skip != 'true' && steps.check_integration.outcome == 'success' && env.COVERAGE != 'true'
        working-directory: apps/${{ env.APP_NAME }}
        run: composer run test:integration

      - name: PHPUnit integration with coverage
        if: steps.php_check.outputs.skip != 'true' && steps.check_integration.outcome == 'success' && env.COVERAGE == 'true'
        working-directory: apps/${{ env.APP_NAME }}
        # the integration config names no source directory, so it is given here
        run: |
          php -d memory_limit=1G -d pcov.directory="$PWD/lib" vendor/bin/phpunit -c tests/Integration/phpunit.xml \
            --coverage-filter lib --coverage-clover coverage/php/integration.xml

      - name: Coverage floor
        # PHPUnit cannot merge two runs; tests/coverage-floor.php merges the
        # two reports line by line, writes the table to the job summary and
        # fails under the floor in tests/coverage-floor.json
        if: env.COVERAGE == 'true' && steps.check_phpunit.outcome == 'success' && steps.check_integration.outcome == 'success'
        working-directory: apps/${{ env.APP_NAME }}
        run: php tests/coverage-floor.php unit=coverage/php/unit.xml integration=coverage/php/integration.xml

      - name: Upload coverage
        if: always() && env.COVERAGE == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: php-coverage
          path: apps/${{ env.APP_NAME }}/coverage/php
          if-no-files-found: ignore
          retention-days: 14

      - name: Print logs
        # always(), so the log is there to read when a test failed
        if: always() && steps.php_check.outputs.skip != 'true'
        run: |
          cat data/nextcloud.log

      - name: Skipped
        # Fail the action when neither unit nor integration tests ran
        if: steps.php_check.outputs.skip != 'true' && steps.check_phpunit.outcome == 'failure' && steps.check_integration.outcome == 'failure'
        run: |
          echo 'Neither PHPUnit nor PHPUnit integration tests are specified in composer.json scripts'
          exit 1

      - name: Skipped notification
        if: steps.php_check.outputs.skip == 'true'
        run: |
          echo "PHP version ${{ matrix.php-versions }} is below app minimum, skipping"

  summary:
    permissions:
      contents: none
    runs-on: ubuntu-latest
    needs: [changes, phpunit-sqlite]

    if: always()

    name: phpunit-sqlite-summary

    steps:
      - name: Summary status
        run: if ${{ needs.changes.outputs.src != 'false' && needs.phpunit-sqlite.result != 'success' }}; then exit 1; fi
