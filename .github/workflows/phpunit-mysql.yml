name: PHPUnit MySQL

# Nightly, by hand, and on a pull request labelled `full-ci` (labelled-ci.yml):
# pull requests run the integration suite on SQLite and PostgreSQL only, and
# MySQL's and MariaDB's differences show up here the next morning.
on:
  schedule:
    - cron: '11 21 * * *'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: phpunit-mysql-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.mariadb.outputs.matrix }}
    steps:
      - name: Checkout app
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get version matrix
        id: versions
        uses: icewind1991/nextcloud-version-matrix@cd0211ffcef1065e2020cd579e4843b8746e7a58 # v1.3.3
        with:
          matrix: '{"mysql-versions": ["8.4"]}'

      - name: Add a MariaDB leg
        # one leg, the newest server on the newest PHP it runs with: MariaDB
        # parts from MySQL in its SQL dialect and its optimizer, not per server
        id: mariadb
        env:
          MATRIX: ${{ steps.versions.outputs.sparse-matrix }}
          SERVER: ${{ steps.versions.outputs.branches-max }}
        run: |
          matrix=$(echo "$MATRIX" | jq -c --arg server "$SERVER" '
            ([.include[] | select(."server-versions" == $server) | ."php-versions"] | max_by(split(".") | map(tonumber))) as $php
            | .include += [{"server-versions": $server, "php-versions": $php, "mariadb-versions": "10.11"}]')
          echo "$matrix" | jq .
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  phpunit-mysql:
    runs-on: ubuntu-latest

    needs: matrix

    strategy:
      matrix: ${{ fromJson(needs.matrix.outputs.matrix) }}

    name: ${{ matrix.mariadb-versions && format('MariaDB {0}', matrix.mariadb-versions) || format('MySQL {0}', matrix.mysql-versions) }} PHP ${{ matrix.php-versions }} Nextcloud ${{ matrix.server-versions }}

    services:
      mysql:
        image: ghcr.io/nextcloud/continuous-integration-${{ matrix.mariadb-versions && format('mariadb-{0}', matrix.mariadb-versions) || format('mysql-{0}', matrix.mysql-versions) }}:latest
        ports:
          - 4444:3306/tcp
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
        options: --health-cmd="${{ matrix.mariadb-versions && 'mariadb-admin' || 'mysqladmin' }} ping" --health-interval 5s --health-timeout 2s --health-retries 10

    steps:
      - name: Set app env
        run: |
          # Split and keep last
          echo "APP_NAME=${GITHUB_REPOSITORY##*/}" >> $GITHUB_ENV

      - name: Checkout server
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          repository: nextcloud/server
          ref: ${{ matrix.server-versions }}

      - name: Checkout app
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: apps/${{ env.APP_NAME }}

      - name: Check PHP version requirement
        id: php_check
        run: |
          PHP_MIN=$(grep -oP 'php min-version="\K[^"]+' apps/${{ env.APP_NAME }}/appinfo/info.xml)
          echo "App requires PHP >= $PHP_MIN, current is ${{ matrix.php-versions }}"
          if php -r "exit(version_compare('${{ matrix.php-versions }}', '$PHP_MIN') < 0 ? 1 : 0);"; then
            echo "PHP version ${{ matrix.php-versions }} meets minimum requirement $PHP_MIN"
          else
            echo "PHP version ${{ matrix.php-versions }} is below minimum $PHP_MIN, skipping"
            echo "skip=true" >> $GITHUB_OUTPUT
          fi

      - name: Set up php ${{ matrix.php-versions }}
        if: steps.php_check.outputs.skip != 'true'
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php-versions }}
          extensions: bz2, ctype, curl, dom, fileinfo, gd, iconv, intl, json, libxml, mbstring, openssl, pcntl, posix, session, simplexml, xmlreader, xmlwriter, zip, zlib, mysql, pdo_mysql
          coverage: none
          ini-file: development
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable ONLY_FULL_GROUP_BY MySQL option
        if: steps.php_check.outputs.skip != 'true'
        run: |
          echo "SET GLOBAL sql_mode=(SELECT CONCAT(@@sql_mode,',ONLY_FULL_GROUP_BY'));" | mysql -h 127.0.0.1 -P 4444 -u root -prootpassword
          echo 'SELECT @@sql_mode;' | mysql -h 127.0.0.1 -P 4444 -u root -prootpassword

      - name: Check composer file existence
        if: steps.php_check.outputs.skip != 'true'
        id: check_composer
        uses: andstor/file-existence-action@558493d6c74bf472d87c84eab196434afc2fa029 # v3.1.0
        with:
          files: apps/${{ env.APP_NAME }}/composer.json

      - name: Set up dependencies
        if: steps.php_check.outputs.skip != 'true' && steps.check_composer.outputs.files_exists == 'true'
        working-directory: apps/${{ env.APP_NAME }}
        run: bash .github/scripts/composer-install-retry.sh install --no-interaction --no-progress --prefer-dist

      - name: Set up Nextcloud
        if: steps.php_check.outputs.skip != 'true'
        env:
          DB_PORT: 4444
        run: |
          mkdir data
          ./occ maintenance:install --verbose --database=mysql --database-name=nextcloud --database-host=127.0.0.1 --database-port=$DB_PORT --database-user=root --database-pass=rootpassword --admin-user admin --admin-pass admin
          ./occ app:enable --force ${{ env.APP_NAME }}

      - name: Check PHPUnit script is defined
        if: steps.php_check.outputs.skip != 'true'
        id: check_phpunit
        continue-on-error: true
        working-directory: apps/${{ env.APP_NAME }}
        run: |
          composer run --list | grep '^  test:unit ' | wc -l | grep 1

      - name: PHPUnit
        if: steps.php_check.outputs.skip != 'true' && steps.check_phpunit.outcome == 'success'
        working-directory: apps/${{ env.APP_NAME }}
        run: composer run test:unit

      - name: Check PHPUnit integration script is defined
        if: steps.php_check.outputs.skip != 'true'
        id: check_integration
        continue-on-error: true
        working-directory: apps/${{ env.APP_NAME }}
        run: |
          composer run --list | grep '^  test:integration ' | wc -l | grep 1

      - name: Run Nextcloud
        if: steps.php_check.outputs.skip != 'true' && steps.check_integration.outcome == 'success'
        run: php -S localhost:8080 &

      - name: PHPUnit integration
        if: steps.php_check.outputs.skip != 'true' && steps.check_integration.outcome == 'success'
        working-directory: apps/${{ env.APP_NAME }}
        run: composer run test:integration

      - name: Print logs
        # always(), so the log is there to read when a test failed
        if: always() && steps.php_check.outputs.skip != 'true'
        run: |
          cat data/nextcloud.log

      - name: Skipped notification
        if: steps.php_check.outputs.skip == 'true'
        run: |
          echo "PHP version ${{ matrix.php-versions }} is below app minimum, skipping"

  summary:
    permissions:
      contents: none
    runs-on: ubuntu-latest
    needs: phpunit-mysql

    if: always()

    name: phpunit-mysql-summary

    steps:
      - name: Summary status
        run: if ${{ needs.phpunit-mysql.result != 'success' }}; then exit 1; fi
