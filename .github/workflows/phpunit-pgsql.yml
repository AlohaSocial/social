name: PHPUnit PostgreSQL

# A pull request and a push run one leg: the newest stable server on the
# newest PHP. The nightly run, a manual run and the `full-ci` label
# (labelled-ci.yml) run the whole matrix.
on:
  pull_request:
  push:
    branches:
      - main
      - master
      - stable*
  schedule:
    - cron: '7 21 * * *'
  workflow_dispatch:
  workflow_call:
    inputs:
      full:
        description: 'Run the whole matrix'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  # per event, so a push cannot replace a pending nightly run, and apart from
  # the pull request's own run when labelled-ci.yml calls this one
  group: phpunit-pgsql-${{ inputs.full && 'full' || github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      # sparse-matrix covers the whole range info.xml claims (both the min and
      # the max server version) with minimal redundancy; branches-max-list
      # tested the newest server only, so the claimed floor went unexercised.
      matrix: ${{ steps.legs.outputs.matrix }}
    steps:
      - name: Checkout app
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get version matrix
        id: versions
        uses: icewind1991/nextcloud-version-matrix@cd0211ffcef1065e2020cd579e4843b8746e7a58 # v1.3.3

      - name: Pick the legs
        id: legs
        env:
          MATRIX: ${{ steps.versions.outputs.sparse-matrix }}
          FULL: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || inputs.full == true }}
        run: |
          if [ "$FULL" = true ]; then
            matrix=$(echo "$MATRIX" | jq -c .)
          else
            matrix=$(echo "$MATRIX" | jq -c --argjson extra '[]' -f .github/scripts/pull-request-legs.jq)
          fi
          echo "$matrix" | jq .
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  changes:
    runs-on: ubuntu-latest
    # the scheduled and the manual run test everything; the filter has no
    # pull request or push to compare with there
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    permissions:
      contents: read
      pull-requests: read

    outputs:
      src: ${{ steps.changes.outputs.src }}

    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: changes
        continue-on-error: true
        with:
          filters: |
            src:
              - '.github/workflows/**'
              - 'appinfo/**'
              - 'lib/**'
              - 'templates/**'
              - 'tests/**'
              - 'vendor/**'
              - 'vendor-bin/**'
              - '.php-cs-fixer.dist.php'
              - 'composer.json'
              - 'composer.lock'
              - 'docs/**'
              - 'README.md'

  phpunit-pgsql:
    runs-on: ubuntu-latest

    needs: [changes, matrix]
    # !cancelled(): `changes` is skipped on the scheduled and the manual run
    if: ${{ !cancelled() && needs.matrix.result == 'success' && needs.changes.outputs.src != 'false' }}

    strategy:
      matrix: ${{ fromJson(needs.matrix.outputs.matrix) }}

    name: PostgreSQL PHP ${{ matrix.php-versions }} Nextcloud ${{ matrix.server-versions }}

    services:
      postgres:
        image: ghcr.io/nextcloud/continuous-integration-postgres-14:latest
        ports:
          - 4444:5432/tcp
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: rootpassword
          POSTGRES_DB: nextcloud
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 2s --health-retries 5

    steps:
      - name: Set app env
        run: |
          # Split and keep last
          echo "APP_NAME=${GITHUB_REPOSITORY##*/}" >> $GITHUB_ENV

      - name: Checkout server
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          repository: nextcloud/server
          ref: ${{ matrix.server-versions }}

      - name: Checkout app
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: apps/${{ env.APP_NAME }}

      - name: Check PHP version requirement
        id: php_check
        run: |
          PHP_MIN=$(grep -oP 'php min-version="\K[^"]+' apps/${{ env.APP_NAME }}/appinfo/info.xml)
          echo "App requires PHP >= $PHP_MIN, current is ${{ matrix.php-versions }}"
          if php -r "exit(version_compare('${{ matrix.php-versions }}', '$PHP_MIN') < 0 ? 1 : 0);"; then
            echo "PHP version ${{ matrix.php-versions }} meets minimum requirement $PHP_MIN"
          else
            echo "PHP version ${{ matrix.php-versions }} is below minimum $PHP_MIN, skipping"
            echo "skip=true" >> $GITHUB_OUTPUT
          fi

      - name: Set up php ${{ matrix.php-versions }}
        if: steps.php_check.outputs.skip != 'true'
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php-versions }}
          # https://docs.nextcloud.com/server/stable/admin_manual/installation/source_installation.html#prerequisites-for-manual-installation
          extensions: bz2, ctype, curl, dom, fileinfo, gd, iconv, intl, json, libxml, mbstring, openssl, pcntl, posix, session, simplexml, xmlreader, xmlwriter, zip, zlib, pgsql, pdo_pgsql
          coverage: none
          ini-file: development
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check composer file existence
        if: steps.php_check.outputs.skip != 'true'
        id: check_composer
        uses: andstor/file-existence-action@558493d6c74bf472d87c84eab196434afc2fa029 # v3.1.0
        with:
          files: apps/${{ env.APP_NAME }}/composer.json

      - name: Set up dependencies
        # Only run if phpunit config file exists
        if: steps.php_check.outputs.skip != 'true' && steps.check_composer.outputs.files_exists == 'true'
        working-directory: apps/${{ env.APP_NAME }}
        run: bash .github/scripts/composer-install-retry.sh install --no-interaction --no-progress --prefer-dist

      - name: Set up Nextcloud
        if: steps.php_check.outputs.skip != 'true'
        env:
          DB_PORT: 4444
        run: |
          mkdir data
          ./occ maintenance:install --verbose --database=pgsql --database-name=nextcloud --database-host=127.0.0.1 --database-port=$DB_PORT --database-user=root --database-pass=rootpassword --admin-user admin --admin-pass admin
          ./occ app:enable --force ${{ env.APP_NAME }}

      - name: Check PHPUnit script is defined
        if: steps.php_check.outputs.skip != 'true'
        id: check_phpunit
        continue-on-error: true
        working-directory: apps/${{ env.APP_NAME }}
        run: |
          composer run --list | grep '^  test:unit ' | wc -l | grep 1

      - name: PHPUnit
        # Only run if phpunit config file exists
        if: steps.php_check.outputs.skip != 'true' && steps.check_phpunit.outcome == 'success'
        working-directory: apps/${{ env.APP_NAME }}
        run: composer run test:unit

      - name: Check PHPUnit integration script is defined
        if: steps.php_check.outputs.skip != 'true'
        id: check_integration
        continue-on-error: true
        working-directory: apps/${{ env.APP_NAME }}
        run: |
          composer run --list | grep '^  test:integration ' | wc -l | grep 1

      - name: Run Nextcloud
        # Only run if phpunit integration config file exists
        if: steps.php_check.outputs.skip != 'true' && steps.check_integration.outcome == 'success'
        run: php -S localhost:8080 &

      - name: PHPUnit integration
        # Only run if phpunit integration config file exists
        if: steps.php_check.outputs.skip != 'true' && steps.check_integration.outcome == 'success'
        working-directory: apps/${{ env.APP_NAME }}
        run: composer run test:integration

      - name: Print logs
        # always(), so the log is there to read when a test failed
        if: always() && steps.php_check.outputs.skip != 'true'
        run: |
          cat data/nextcloud.log

      - name: Skipped
        # Fail the action when neither unit nor integration tests ran
        if: steps.php_check.outputs.skip != 'true' && steps.check_phpunit.outcome == 'failure' && steps.check_integration.outcome == 'failure'
        run: |
          echo 'Neither PHPUnit nor PHPUnit integration tests are specified in composer.json scripts'
          exit 1

      - name: Skipped notification
        if: steps.php_check.outputs.skip == 'true'
        run: |
          echo "PHP version ${{ matrix.php-versions }} is below app minimum, skipping"

  summary:
    permissions:
      contents: none
    runs-on: ubuntu-latest
    needs: [changes, phpunit-pgsql]

    if: always()

    name: phpunit-pgsql-summary

    steps:
      - name: Summary status
        run: if ${{ needs.changes.outputs.src != 'false' && needs.phpunit-pgsql.result != 'success' }}; then exit 1; fi
