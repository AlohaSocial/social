#
# The upgrade an administrator runs: a published release installed and given
# data, then replaced by this checkout and upgraded with `occ upgrade`, so the
# migrations and repair steps run against real rows rather than an empty
# schema. Afterwards the schema has to match a fresh install's, what was
# seeded has to read back through the client API (tests/Upgrade/verify.py),
# and the integration suite has to pass on the upgraded instance.
#
# Two starting points. "Latest" is whatever GitHub marks as the latest release
# when the job runs, so a new release moves it without an edit here. 0.10.0 is
# the oldest release the squashed schema has to bring up to date: its tables
# predate every step the squash replaced. It runs on Nextcloud up to 34, so
# the app is upgraded there and Nextcloud to 35 after it, the order an
# administrator on 34 takes, and the checks run on 35 like the other legs'.
#
# Nightly, by hand, and on a pull request labelled `full-ci` (labelled-ci.yml).

name: Upgrade from a release

on:
  schedule:
    - cron: '29 21 * * *'
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upgrade-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  upgrade:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - { from: latest, server: stable35, database: sqlite }
          - { from: latest, server: stable35, database: pgsql }
          - { from: v0.10.0, server: stable34, database: sqlite }
          - { from: v0.10.0, server: stable34, database: pgsql }
          # the squash adds an autoincrement key to two tables of 0.10.0,
          # which only MySQL refuses to do wrong
          - { from: v0.10.0, server: stable34, database: mysql }

    name: ${{ matrix.from == 'latest' && format('Upgrade on {0}', matrix.database) || format('Upgrade from {0} on {1}', matrix.from, matrix.database) }}

    services:
      # started for every leg; the others simply do not use them
      postgres:
        image: ghcr.io/nextcloud/continuous-integration-postgres-14:latest
        ports:
          - 4444:5432/tcp
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: rootpassword
          POSTGRES_DB: nextcloud
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 2s --health-retries 5
      mysql:
        image: ghcr.io/nextcloud/continuous-integration-mysql-8.4:latest
        ports:
          - 4445:3306/tcp
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
        options: --health-cmd="mysqladmin ping" --health-interval 5s --health-timeout 2s --health-retries 10

    env:
      APP_NAME: social
      NC_URL: http://localhost:8080
      SEED_STATE: /tmp/social-upgrade-seed.json

    steps:
      - name: Checkout server
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          repository: nextcloud/server
          ref: ${{ matrix.server }}

      - name: Checkout viewer
        # always enabled on Nextcloud 34, and not part of the server repository
        if: matrix.server == 'stable34'
        run: git clone --quiet --depth 1 --branch stable34 https://github.com/nextcloud/viewer apps/viewer

      - name: Checkout the change under test
        # outside apps/, so the server sees one copy of the app at a time
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: upgrade-to

      - name: Set up php
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          extensions: bz2, ctype, curl, dom, fileinfo, gd, iconv, intl, json, libxml, mbstring, openssl, pcntl, posix, session, simplexml, xmlreader, xmlwriter, zip, zlib, sqlite, pdo_sqlite, pgsql, pdo_pgsql, mysql, pdo_mysql
          coverage: none
          ini-file: development
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch the release
        env:
          GH_TOKEN: ${{ github.token }}
          FROM: ${{ matrix.from }}
        run: |
          set -euo pipefail
          if [ "$FROM" = 'latest' ]; then
            tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          else
            tag=$FROM
          fi
          echo "Upgrading from $tag"
          echo "### Upgrade from $tag" >> "$GITHUB_STEP_SUMMARY"
          # the tarball the release workflow attaches is what the app store
          # serves; a release without one is installed from its tag
          asset=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets \
            --jq ".assets[].name | select(startswith(\"$APP_NAME\") and endswith(\".tar.gz\"))" | head -1)
          if [ -n "$asset" ]; then
            release=$(mktemp -d)
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern "$asset" --dir "$release"
            tar -xzf "$release/$asset" -C apps
          else
            git clone --quiet --depth 1 --branch "$tag" "https://github.com/$GITHUB_REPOSITORY" "apps/$APP_NAME"
            bash "apps/$APP_NAME/.github/scripts/composer-install-retry.sh" install --no-dev --no-interaction --no-progress --prefer-dist --working-dir="apps/$APP_NAME"
          fi
          grep -o '<version>[^<]*</version>' "apps/$APP_NAME/appinfo/info.xml"

      - name: Install Nextcloud with the release
        run: |
          set -euo pipefail
          mkdir data
          if [ '${{ matrix.database }}' = 'pgsql' ]; then
            ./occ maintenance:install --verbose --database=pgsql --database-name=nextcloud --database-host=127.0.0.1 \
              --database-port=4444 --database-user=root --database-pass=rootpassword --admin-user admin --admin-pass admin
          elif [ '${{ matrix.database }}' = 'mysql' ]; then
            ./occ maintenance:install --verbose --database=mysql --database-name=nextcloud --database-host=127.0.0.1 \
              --database-port=4445 --database-user=root --database-pass=rootpassword --admin-user admin --admin-pass admin
          else
            ./occ maintenance:install --verbose --database=sqlite --database-name=nextcloud --admin-user admin --admin-pass admin
          fi
          ./occ app:enable --force "$APP_NAME"
          ./occ config:app:get "$APP_NAME" installed_version
          # `occ upgrade` would otherwise ask the app store for a newer copy
          # of the app than the one under test
          ./occ config:system:set appstoreenabled --value false --type boolean

      - name: Run Nextcloud
        # several workers: creating an account makes the app fetch its own
        # avatar over HTTP, which a single-worker server deadlocks on
        run: PHP_CLI_SERVER_WORKERS=4 php -S localhost:8080 &

      - name: Seed data with the release
        run: bash upgrade-to/tests/Upgrade/seed.sh

      - name: Swap in the change under test
        run: |
          set -euo pipefail
          rm -rf "apps/$APP_NAME"
          mv upgrade-to "apps/$APP_NAME"
          bash "apps/$APP_NAME/.github/scripts/composer-install-retry.sh" install --no-interaction --no-progress --prefer-dist --working-dir="apps/$APP_NAME"

      - name: Upgrade
        run: |
          set -euo pipefail
          php -d memory_limit=1G occ upgrade
          version=$(sed -n 's:.*<version>\(.*\)</version>.*:\1:p' "apps/$APP_NAME/appinfo/info.xml" | head -1)
          # the value is the last line: occ may print a warning about the
          # PCNTL functions to stdout before it
          installed=$(./occ config:app:get "$APP_NAME" installed_version | tail -n 1)
          echo "Upgraded to $installed" | tee -a "$GITHUB_STEP_SUMMARY"
          test "$installed" = "$version"

      - name: Upgrade Nextcloud to 35
        if: matrix.server == 'stable34'
        run: |
          set -euo pipefail
          # the app and the data stay where they are; only the server's own
          # files are replaced, as an administrator's update does
          git fetch --quiet --depth 1 origin stable35
          git checkout --quiet --force FETCH_HEAD
          git submodule update --quiet --init --depth 1
          git -C apps/viewer fetch --quiet --depth 1 origin stable35
          git -C apps/viewer checkout --quiet --force FETCH_HEAD
          php -d memory_limit=1G occ upgrade
          ./occ status
          pkill -f 'php -S localhost:8080' || true
          PHP_CLI_SERVER_WORKERS=4 php -S localhost:8080 > /dev/null 2>&1 &
          sleep 2

      - name: The schema matches a fresh install's
        # the server's own tables are its business; only this app's are checked
        run: |
          ./occ db:schema:check -v 2>&1 | tee /tmp/schema-check.txt || true
          if grep -q "oc_${APP_NAME}_" /tmp/schema-check.txt; then
            echo "The upgraded schema of the app differs from what a fresh install creates"
            exit 1
          fi

      - name: Seeded data reads back
        run: python3 "apps/$APP_NAME/tests/Upgrade/verify.py"

      - name: PHPUnit integration
        working-directory: apps/${{ env.APP_NAME }}
        run: composer run test:integration

      - name: Print logs
        if: always()
        run: cat data/nextcloud.log || true
