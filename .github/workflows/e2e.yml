#
# The browser tests: a throwaway Nextcloud with this app installed, driven by
# Playwright the way a person would drive it. The unit and integration suites
# cannot see a page that stays empty; this can. See tests/e2e/.
#
# A pull request and a push to main run one leg, about four minutes: the
# newest stable server on SQLite in Chromium, with the Guests app. The nightly
# run, a manual run and the `full-ci` label (labelled-ci.yml) add Nextcloud
# master, the oldest server info.xml claims (34), PostgreSQL, and the smoke
# spec in Firefox.
#
# The weekly and the manual run also try the install shapes production has
# and the built-in server on its own does not: Nextcloud under a sub-path
# (/nextcloud), pretty URLs (no index.php in the links), and HTTPS behind a
# proxy. tests/e2e/server/router.php gives PHP's built-in server the first
# two, the way Nextcloud's .htaccess and an administrator's rewrites do;
# Caddy in a container, with a certificate made for the run, gives the third.
# They also read the app in the en_XA pseudo-locale on both top server
# versions: tests/e2e/pseudo-locale.mjs writes it at test time (every string
# accented, a third longer and bracketed), which shows text that skips t()
# and layouts that only fit English. That leg runs its one spec in place of
# the suite.

name: Browser tests

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  workflow_call:
    inputs:
      full:
        description: 'Add the nightly legs'
        type: boolean
        default: true
  schedule:
    # nightly, but on Wednesdays, when the weekly run below has every leg
    - cron: '33 21 * * 0,1,2,4,5,6'
    # weekly, and by hand: the install shapes and the en_XA pseudo-locale
    # (below); WEEKLY in the legs job names this one
    - cron: '45 21 * * 3'

permissions:
  contents: read

concurrency:
  # per event, so a push cannot replace a pending nightly run, and apart from
  # the pull request's own run when labelled-ci.yml calls this one
  group: e2e-${{ inputs.full && 'full' || github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  legs:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.legs.outputs.matrix }}
    steps:
      # The pages this drives are built from the server's own layout and CSS
      # variables, which is exactly what a major server version changes, so
      # one version cannot stand in for another: `master` is Nextcloud 36
      # until it branches off as stable36, and 34 is the floor info.xml
      # claims. PostgreSQL is the database most production instances run;
      # Firefox draws and lays out with an engine of its own.
      - name: Pick the legs
        id: legs
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          WEEKLY: '27 4 * * 3'
          FULL: ${{ inputs.full == true }}
        run: |
          legs='[
            {"server": "stable35", "db": "sqlite", "browser": "chromium", "guests": true}
          ]'
          if [ "$EVENT" = schedule ] || [ "$EVENT" = workflow_dispatch ] || [ "$FULL" = true ]; then
            legs=$(echo "$legs" | jq '. + [
              {"server": "master", "db": "sqlite", "browser": "chromium"},
              {"server": "stable34", "db": "sqlite", "browser": "chromium"},
              {"server": "stable35", "db": "pgsql", "browser": "chromium"},
              {"server": "stable35", "db": "sqlite", "browser": "firefox"}
            ]')
          fi
          if [ "$SCHEDULE" = "$WEEKLY" ] || [ "$EVENT" = workflow_dispatch ]; then
            legs=$(echo "$legs" | jq '. + [
              {"server": "stable35", "db": "sqlite", "browser": "chromium", "webroot": "/nextcloud"},
              {"server": "stable35", "db": "sqlite", "browser": "chromium", "pretty": true},
              {"server": "stable35", "db": "sqlite", "browser": "chromium", "https": true},
              {"server": "stable35", "db": "sqlite", "browser": "chromium", "webroot": "/nextcloud", "pretty": true, "https": true},
              {"server": "stable35", "db": "sqlite", "browser": "chromium", "locale": "en_XA"},
              {"server": "master", "db": "sqlite", "browser": "chromium", "locale": "en_XA"}
            ]')
          fi
          echo "matrix=$(echo "$legs" | jq -c '{include: .}')" | tee -a "$GITHUB_OUTPUT"

  e2e:
    runs-on: ubuntu-latest
    needs: legs

    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.legs.outputs.matrix) }}

    name: >-
      Playwright against Nextcloud ${{ matrix.server }} on ${{ matrix.db }} in ${{ matrix.browser }}${{
      matrix.webroot && format(', under {0}', matrix.webroot) || '' }}${{
      matrix.pretty && ', pretty URLs' || '' }}${{ matrix.https && ', HTTPS' || '' }}${{
      matrix.locale && format(', in {0}', matrix.locale) || '' }}

    env:
      E2E_WEBROOT: ${{ matrix.webroot }}
      E2E_PRETTY_URLS: ${{ matrix.pretty && '1' || '' }}
      E2E_HTTPS: ${{ matrix.https && '1' || '' }}

    steps:
      - name: Set app env
        run: echo "APP_NAME=${GITHUB_REPOSITORY##*/}" >> $GITHUB_ENV

      - name: Work out the address
        # where this leg's Nextcloud answers, and where the app says it lives
        run: |
          if [ -n "$E2E_HTTPS" ]; then host=localhost:8443; scheme=https; else host=localhost:8080; scheme=http; fi
          base="$scheme://$host$E2E_WEBROOT"
          if [ -n "$E2E_PRETTY_URLS" ]; then app="$base/apps/social/"; else app="$base/index.php/apps/social/"; fi
          {
            echo "E2E_HOST=$host"
            echo "E2E_BASE_URL=$base"
            echo "E2E_SOCIAL_URL=$app"
          } | tee -a "$GITHUB_ENV"

      - name: Checkout server
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          repository: nextcloud/server
          ref: ${{ matrix.server }}

      - name: Checkout app
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: apps/${{ env.APP_NAME }}

      - name: Checkout the Guests app for the compatibility run
        if: matrix.guests
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: nextcloud/guests
          ref: v4.9.0
          path: apps/guests

      - name: Set up php
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          extensions: bz2, ctype, curl, dom, fileinfo, gd, iconv, intl, json, libxml, mbstring, openssl, pcntl, posix, session, simplexml, xmlreader, xmlwriter, zip, zlib, sqlite, pdo_sqlite, pgsql, pdo_pgsql
          coverage: none
          ini-file: development
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install ffmpeg
        # shorts.spec.mjs makes its videos with ffmpeg, and the server measures them with ffprobe
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg

      - name: Start PostgreSQL
        # the image phpunit-pgsql.yml uses
        if: matrix.db == 'pgsql'
        run: |
          docker run -d --name db -p 4444:5432 \
            -e POSTGRES_USER=root -e POSTGRES_PASSWORD=rootpassword -e POSTGRES_DB=nextcloud \
            ghcr.io/nextcloud/continuous-integration-postgres-14:latest
          for attempt in $(seq 1 60); do
            docker exec db pg_isready -U root >/dev/null 2>&1 && exit 0
            sleep 2
          done
          docker logs db
          exit 1

      - name: Set up Guests PHP dependencies
        if: matrix.guests
        working-directory: apps/guests
        run: bash ../${{ env.APP_NAME }}/.github/scripts/composer-install-retry.sh install --no-dev --no-interaction --no-progress --prefer-dist

      - name: Set up the app's PHP dependencies
        working-directory: apps/${{ env.APP_NAME }}
        run: bash .github/scripts/composer-install-retry.sh install --no-dev --no-interaction --no-progress --prefer-dist

      - name: Set up Nextcloud
        env:
          OC_PASS: Browser-Test-2026!
        run: |
          mkdir data
          ./occ maintenance:install --verbose --database=${{ matrix.db }} --database-name=nextcloud --database-host=127.0.0.1 --database-port=4444 --database-user=root --database-pass=rootpassword --admin-user admin --admin-pass admin
          ./occ app:enable --force ${{ env.APP_NAME }}
          if [ "${{ matrix.guests }}" = "true" ]; then
            ./occ app:enable --force guests
            ./occ config:app:set guests usewhitelist --value yes --type boolean
            # Start without Social allowed; the browser test verifies the real 403,
            # then enables Social and verifies normal access for the Guests user.
            ./occ config:app:set guests whitelist --value files
            OC_PASS="$OC_PASS" ./occ guests:add admin guest@example.org --uid=guest --password-from-env --display-name "Guest account"
          fi
          # a second account and a group, so the group list has somebody in it
          ./occ user:add --password-from-env --display-name "Bob" bob
          ./occ group:add design
          ./occ group:adduser design admin
          ./occ group:adduser design bob
          # a Nextcloud group becomes a Social list only where an administrator
          # has chosen it; the smoke test walks that list, so it is chosen here
          ./occ config:app:set social group_lists --value '["design"]'
          ./occ config:system:set trusted_domains 1 --value "$E2E_HOST"
          ./occ config:system:set overwrite.cli.url --value "$E2E_BASE_URL"
          # the app's own idea of where it lives; the setup page writes these on
          # a real instance, and everything from actor creation to a timeline
          # read throws without them (tests/Integration/bootstrap.php does the same)
          ./occ config:app:set social cloud_url --value "$E2E_BASE_URL"
          ./occ config:app:set social social_url --value "$E2E_SOCIAL_URL"
          if [ -n "$E2E_HTTPS" ]; then
            ./occ config:system:set overwriteprotocol --value https
          fi
          # the instance has to be allowed to talk to itself: with the built-in
          # server it is `localhost`, which the HTTP client refuses by default
          ./occ config:system:set allow_local_remote_servers --value true --type boolean
          # a hashtag the search test can find: search reads the hashtag
          # table the twelve-minute cron fills, and no cron runs here
          ./occ social:account:create admin
          ./occ social:note:create -q admin 'Seeded for the search test #alohasearch'
          ./occ social:cache:refresh

      - name: Run Nextcloud
        # several workers, not the default one: rendering the app makes the
        # server fetch its own avatar route over HTTP, and a single-worker
        # built-in server deadlocks on that until the ten-second timeout, so
        # every page came out as a 500
        run: |
          if [ -z "$E2E_WEBROOT$E2E_PRETTY_URLS" ]; then
            PHP_CLI_SERVER_WORKERS=8 php -S localhost:8080 &
            exit 0
          fi
          # under a sub-path the document root is a directory that has the
          # server in it under that name
          docroot=$PWD
          if [ -n "$E2E_WEBROOT" ]; then
            docroot=$RUNNER_TEMP/docroot
            mkdir -p "$(dirname "$docroot$E2E_WEBROOT")"
            ln -s "$PWD" "$docroot$E2E_WEBROOT"
          fi
          PHP_CLI_SERVER_WORKERS=8 php -S localhost:8080 -t "$docroot" "$PWD/apps/$APP_NAME/tests/e2e/server/router.php" &

      - name: Serve it over HTTPS
        # Caddy in front of the built-in server, as in interop.yml, with a CA
        # made here and thrown away with the job. Nextcloud fetches its own
        # pages (the avatar route) with its own CA bundle, so the CA goes in
        # there; the browser is told to accept the certificate instead
        # (E2E_IGNORE_HTTPS_ERRORS).
        if: matrix.https
        run: |
          set -euo pipefail
          mkdir -p /tmp/tls && cd /tmp/tls
          openssl req -x509 -newkey rsa:2048 -nodes -days 2 -subj '/CN=Browser test CA' \
            -keyout ca.key -out ca.crt \
            -addext 'basicConstraints=critical,CA:true' -addext 'keyUsage=critical,keyCertSign,cRLSign'
          openssl req -newkey rsa:2048 -nodes -subj '/CN=localhost' -keyout nc.key -out nc.csr
          printf 'subjectAltName=DNS:localhost\nextendedKeyUsage=serverAuth\n' > nc.ext
          openssl x509 -req -in nc.csr -CA ca.crt -CAkey ca.key -CAcreateserial -days 2 \
            -extfile nc.ext -out nc.crt
          chmod 644 nc.key
          cd "$GITHUB_WORKSPACE"
          ./occ security:certificates:import /tmp/tls/ca.crt
          cat > /tmp/tls/Caddyfile <<'CADDY'
          {
            admin off
            auto_https disable_redirects
          }
          localhost:8443 {
            tls /tls/nc.crt /tls/nc.key
            reverse_proxy localhost:8080
          }
          CADDY
          docker run -d --name proxy --network host -v /tmp/tls:/tls:ro caddy:2 \
            caddy run --config /tls/Caddyfile --adapter caddyfile
          for attempt in $(seq 1 30); do
            curl -sf --cacert /tmp/tls/ca.crt "$E2E_BASE_URL/status.php" && exit 0
            sleep 2
          done
          docker logs proxy
          exit 1

      - name: Read package.json node and npm engines version
        uses: skjnldsv/read-package-engines-version-actions@06d6db44aa62f4609ba070f556ec24bc99fb85cb # v4
        id: versions
        with:
          path: apps/${{ env.APP_NAME }}
          fallbackNode: '^20'
          fallbackNpm: '^10'

      - name: Set up node ${{ steps.versions.outputs.nodeVersion }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.versions.outputs.nodeVersion }}

      - name: Set up npm ${{ steps.versions.outputs.npmVersion }}
        run: npm i -g 'npm@${{ steps.versions.outputs.npmVersion }}'

      - name: Install the test runner
        working-directory: apps/${{ env.APP_NAME }}
        run: |
          npm ci
          npx playwright install --with-deps ${{ matrix.browser }}

      - name: Install the pseudo-locale and make it the test account's language
        if: matrix.locale == 'en_XA'
        run: |
          node apps/${{ env.APP_NAME }}/tests/e2e/pseudo-locale.mjs
          ./occ user:setting bob core lang en_XA

      - name: Browser tests
        if: matrix.locale != 'en_XA'
        working-directory: apps/${{ env.APP_NAME }}
        env:
          E2E_IGNORE_HTTPS_ERRORS: ${{ matrix.https && '1' || '' }}
          # not the admin: for an admin the app first runs its setup check, and
          # the WebFinger probe cannot pass behind PHP's built-in server (no
          # .well-known rewrite), so the admin would see the setup page and no
          # sidebar. A plain account gets the app.
          E2E_USER: bob
          E2E_PASSWORD: Browser-Test-2026!
          E2E_GROUP: design
          E2E_GUEST: ${{ matrix.guests && 'guest' || '' }}
          # another engine runs the smoke spec only (playwright.config.mjs)
          E2E_BROWSERS: ${{ matrix.browser != 'chromium' && matrix.browser || '' }}
        run: npm run test:e2e -- --project=${{ matrix.browser }}

      - name: Browser tests in the pseudo-locale
        if: matrix.locale == 'en_XA'
        working-directory: apps/${{ env.APP_NAME }}
        env:
          E2E_USER: bob
          E2E_PASSWORD: Browser-Test-2026!
          E2E_PSEUDO_LOCALE: '1'
        run: npm run test:e2e -- pseudo-locale.spec.mjs

      - name: Keep the report when something failed
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # per leg: two jobs uploading one name is an error
          name: playwright-report-${{ strategy.job-index }}-${{ matrix.server }}-${{ matrix.db }}-${{ matrix.browser }}
          # relative to the config file, tests/e2e/playwright.config.mjs
          path: |
            apps/${{ env.APP_NAME }}/tests/e2e/playwright-report
            apps/${{ env.APP_NAME }}/tests/e2e/test-results
          retention-days: 7

      - name: Print the server log
        if: failure()
        run: cat data/nextcloud.log
