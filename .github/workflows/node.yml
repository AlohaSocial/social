# Builds the frontend and checks that the committed bundle matches src/.
#
# js/ is the shipped artifact — the Makefile's appstore target excludes /src/ — so a pull
# request that changes src/ without rebuilding ships nothing. Nothing in CI
# used to catch that: `npm run build` ran only on release publish.
#
# Structure mirrors the organisation's lint-eslint template. The summary job is
# named `node` and runs on every pull request and every push to the default
# branch — green when the paths filter reports no frontend change — so a single
# branch-protection rule on `node` is always satisfied by exactly one run. The
# former node-when-unrelated.yml emitted a second check under the same name and
# has been removed.
#
# SPDX-FileCopyrightText: 2026 Nextcloud GmbH and Nextcloud contributors
# SPDX-License-Identifier: MIT

name: Node

on:
  pull_request:
  push:
    branches:
      - main
      - stable*

permissions:
  contents: read

concurrency:
  group: node-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    outputs:
      src: ${{ steps.changes.outputs.src}}

    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: changes
        continue-on-error: true
        with:
          filters: |
            src:
              - '.github/workflows/**'
              - 'src/**'
              - 'js/**'
              - 'appinfo/info.xml'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig.json'
              - 'webpack.*.js'
              - 'babel.config.js'
              - '**.js'
              - '**.ts'
              - '**.vue'

  build:
    runs-on: ubuntu-latest

    needs: changes
    if: needs.changes.outputs.src != 'false'

    name: NPM build

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read package.json node and npm engines version
        uses: skjnldsv/read-package-engines-version-actions@06d6db44aa62f4609ba070f556ec24bc99fb85cb # v4
        id: versions
        with:
          fallbackNode: '^20'
          fallbackNpm: '^10'

      - name: Set up node ${{ steps.versions.outputs.nodeVersion }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.versions.outputs.nodeVersion }}

      - name: Set up npm ${{ steps.versions.outputs.npmVersion }}
        run: npm i -g 'npm@${{ steps.versions.outputs.npmVersion }}'

      - name: Install dependencies
        env:
          CYPRESS_INSTALL_BINARY: 0
          PUPPETEER_SKIP_DOWNLOAD: true
        run: npm ci

      - name: Build
        run: npm run build

      - name: Check the committed bundle matches src/
        run: |
          # js/ is what an app-store install runs. If this fails, run
          # `npm run build` and commit js/ along with your src/ change.
          if [ -n "$(git status --porcelain -- js/)" ]; then
            echo "::error::js/ is out of date: rebuild with 'npm run build' and commit js/."
            git status --porcelain -- js/
            git --no-pager diff --stat -- js/
            git --no-pager diff -- js/ | head -n 200
            exit 1
          fi
          echo "js/ matches src/."

  summary:
    permissions:
      contents: none
    runs-on: ubuntu-latest
    needs: [changes, build]

    if: always()

    # This is the summary, we just avoid to rename it so that branch protection
    # rules still match.
    name: node

    steps:
      - name: Summary status
        run: if ${{ needs.changes.outputs.src != 'false' && needs.build.result != 'success' }}; then exit 1; fi
