name: Lint info.xml

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - stable*

permissions:
  contents: read

concurrency:
  group: lint-info-xml-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  xml-linters:
    runs-on: ubuntu-latest-low

    name: info.xml lint
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Pinned to a commit, not master: a schema fetched at run time can turn
      # an unrelated pull request red (or green) without anything in this repo
      # changing. Bump SCHEMA_REF and SCHEMA_SHA256 together, deliberately.
      - name: Download schema
        env:
          SCHEMA_REF: c8fe8dcb388d2ed7b566e982fd64aa38463ba80a
          SCHEMA_SHA256: a8ec208d4be9e507dc28b24e1bb7d8fafa45cbf00ed4b460f1545b131369d362
        run: |
          curl -fsSL -o info.xsd \
            "https://raw.githubusercontent.com/nextcloud/appstore/$SCHEMA_REF/nextcloudappstore/api/v1/release/info.xsd"
          echo "$SCHEMA_SHA256  info.xsd" | sha256sum -c -

      - name: Lint info.xml
        uses: ChristophWurst/xmllint-action@36f2a302f84f8c83fceea0b9c59e1eb4a616d3c1 # v1.2
        with:
          xml-file: ./appinfo/info.xml
          xml-schema-file: ./info.xsd
