#
# Interop: this app's activities delivered to a real Mastodon and a real
# PeerTube, read back out of each one's own API. See tests/Interop/README.md for
# why, and for what this cannot prove.
#
# On every pull request and every push to master, as well as weekly and by
# hand. It stands up four containers and depends on third-party images whose
# startup this repository does not control, so a red run is worth reading for
# which side failed before blaming the change under review: the last step
# prints what each side saw. A newer push to the same pull request cancels the
# run still going for the old one.

name: Interop against Mastodon and PeerTube

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:
  schedule:
    # Mondays, early: a week is the right cadence for "has the other end moved"
    - cron: '17 4 * * 1'

permissions:
  contents: read

concurrency:
  group: interop-mastodon-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  interop:
    runs-on: ubuntu-latest
    name: Nextcloud Social ↔ Mastodon, PeerTube

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mastodon
          POSTGRES_PASSWORD: mastodon
          POSTGRES_DB: mastodon_production
        options: >-
          --health-cmd "pg_isready -U mastodon"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 6379:6379

    env:
      APP_NAME: social
      # Both sides talk to each other over the runner's own loopback, so both
      # have to be willing to. Mastodon refuses private addresses unless it is
      # told otherwise, and Nextcloud's HTTP client refuses localhost unless it
      # is told otherwise; each gets exactly that one permission and nothing
      # else, because it is a throwaway runner and not a real deployment.
      MASTODON_HOST: mastodon.test
      MASTODON_BASE_URL: https://mastodon.test
      PEERTUBE_HOST: localhost:9000
      PEERTUBE_BASE_URL: http://localhost:9000
      PEERTUBE_USER: interop
      PEERTUBE_PASSWORD: Interop-Test-2026!
      NEXTCLOUD_URL: https://nextcloud.test

    steps:
      - name: Checkout server
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: true
          repository: nextcloud/server
          # see e2e.yml: the newest version info.xml claims
          ref: master

      - name: Checkout app
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: apps/social

      - name: Checkout the notifications app
        # where a raised Nextcloud notification is stored: the notification
        # policy test reads its table to tell "raised nothing" from "raised"
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: nextcloud/notifications
          ref: master
          path: apps/notifications

      - name: Set up php
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          extensions: bz2, ctype, curl, dom, fileinfo, gd, iconv, intl, json, libxml, mbstring, openssl, pcntl, posix, session, simplexml, xmlreader, xmlwriter, zip, zlib, sqlite, pdo_sqlite
          coverage: none
          ini-file: development

      - name: Set up the app's PHP dependencies
        working-directory: apps/social
        # without the dev ones, as the app store ships it: the app's autoloader
        # is prepended to the server's, so a dev-only package the server also
        # carries (symfony/console) is served in place of the server's own
        run: composer i --no-dev

      - name: Set up the notifications app's PHP dependencies
        # before the install: maintenance:install enables shipped apps, this
        # one among them, and loads its vendor/autoload.php right away
        run: |
          if [ -f apps/notifications/composer.json ]; then
            composer i --no-dev --no-interaction --working-dir=apps/notifications
          fi

      - name: Give Nextcloud a name and a certificate
        # Mastodon and PeerTube fetch another server's webfinger and actor over
        # https only, so the Nextcloud they federate with needs a host name and
        # a certificate they trust. A CA made here, trusted by the runner and
        # handed to both containers, and thrown away with the job.
        run: |
          set -euo pipefail
          echo '127.0.0.1 nextcloud.test mastodon.test' | sudo tee -a /etc/hosts
          mkdir -p /tmp/tls && cd /tmp/tls
          openssl req -x509 -newkey rsa:2048 -nodes -days 2 -subj '/CN=Interop CA' \
            -keyout ca.key -out ca.crt \
            -addext 'basicConstraints=critical,CA:true' -addext 'keyUsage=critical,keyCertSign,cRLSign'
          openssl req -newkey rsa:2048 -nodes -subj '/CN=nextcloud.test' -keyout nc.key -out nc.csr
          printf 'subjectAltName=DNS:nextcloud.test,DNS:mastodon.test\nextendedKeyUsage=serverAuth\n' > nc.ext
          openssl x509 -req -in nc.csr -CA ca.crt -CAkey ca.key -CAcreateserial -days 2 \
            -extfile nc.ext -out nc.crt
          chmod 644 nc.key
          sudo cp ca.crt /usr/local/share/ca-certificates/interop-ca.crt
          sudo update-ca-certificates

      - name: Set up Nextcloud
        run: |
          mkdir data
          ./occ maintenance:install --verbose --database=sqlite --database-name=nextcloud \
            --admin-user admin --admin-pass admin
          ./occ app:enable --force social
          ./occ app:enable --force notifications
          # two more accounts for the Move tests: one moves away, one is moved to
          OC_PASS='Interop-Test-2026!' ./occ user:add --password-from-env mover
          OC_PASS='Interop-Test-2026!' ./occ user:add --password-from-env arrival
          OC_PASS='Interop-Test-2026!' ./occ user:add --password-from-env puller
          # one account per thing a test does to its own account, so no test
          # finds another's locked, renamed, deleted or unfollowed account:
          # shy locks itself, profile edits itself, goner deletes itself,
          # watcher follows and unfollows a PeerTube channel, and bystander
          # is the other reader here a direct message must not reach
          for user in shy profile goner watcher bystander; do
            OC_PASS='Interop-Test-2026!' ./occ user:add --password-from-env "$user"
          done
          ./occ config:system:set trusted_domains 1 --value localhost:8080
          ./occ config:system:set trusted_domains 2 --value nextcloud.test
          ./occ config:system:set overwriteprotocol --value https
          ./occ config:system:set overwritehost --value nextcloud.test
          # Nextcloud's own HTTP client keeps its own CA bundle
          ./occ security:certificates:import /tmp/tls/ca.crt
          ./occ config:system:set overwrite.cli.url --value "$NEXTCLOUD_URL"
          ./occ config:app:set social cloud_url --value "$NEXTCLOUD_URL"
          ./occ config:app:set social social_url --value "$NEXTCLOUD_URL/index.php/apps/social/"
          # the two instances are on the same host, so both HTTP clients have to
          # be willing to talk to a private address
          ./occ config:system:set allow_local_remote_servers --value true --type boolean
          # info, not warning: a delivery that fails or is held back is a notice
          ./occ log:manage --level=info

      - name: Run Nextcloud
        # several workers: rendering or fetching anything makes the server ask
        # itself over HTTP, and a single-worker built-in server deadlocks on that
        # behind a TLS proxy at https://nextcloud.test, which is the address
        # the other two servers are given
        run: |
          PHP_CLI_SERVER_WORKERS=8 php -S localhost:8080 &
          cat > /tmp/tls/Caddyfile <<'CADDY'
          {
            admin off
            auto_https disable_redirects
          }
          nextcloud.test:443 {
            tls /tls/nc.crt /tls/nc.key
            log
            # what Nextcloud's .htaccess does under Apache: the built-in
            # server only serves files, and webfinger, nodeinfo and host-meta
            # are routes of index.php
            @wellknown path /.well-known/*
            rewrite @wellknown /index.php{path}
            reverse_proxy localhost:8080
          }
          # Mastodon in production redirects anything that is not https, its
          # API included, so it sits behind the same proxy
          mastodon.test:443 {
            tls /tls/nc.crt /tls/nc.key
            log
            reverse_proxy localhost:3000
          }
          CADDY
          docker run -d --name proxy --network host -v /tmp/tls:/tls:ro caddy:2 \
            caddy run --config /tls/Caddyfile --adapter caddyfile
          for attempt in $(seq 1 30); do
            # nodeinfo proves the /.well-known rewrite as well as the proxy
            curl -sf https://nextcloud.test/status.php \
              && curl -sf https://nextcloud.test/.well-known/nodeinfo && exit 0
            sleep 2
          done
          docker logs proxy
          exit 1

      - name: Start Mastodon
        run: |
          set -euo pipefail
          # the keys Mastodon refuses to boot without. Generated here and thrown
          # away with the runner: they protect nothing, because there is nothing
          # in this instance that outlives the job.
          SECRET_KEY_BASE=$(openssl rand -hex 64)
          OTP_SECRET=$(openssl rand -hex 64)
          AR_KEYS="ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY=$(openssl rand -hex 16)"
          AR_KEYS="$AR_KEYS,ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT=$(openssl rand -hex 16)"
          AR_KEYS="$AR_KEYS,ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY=$(openssl rand -hex 16)"

          cat > /tmp/mastodon.env <<ENV
          LOCAL_DOMAIN=${MASTODON_HOST}
          LOCAL_HTTPS=true
          SECRET_KEY_BASE=${SECRET_KEY_BASE}
          OTP_SECRET=${OTP_SECRET}
          $(echo "$AR_KEYS" | tr ',' '\n')
          DB_HOST=172.17.0.1
          DB_PORT=5432
          DB_NAME=mastodon_production
          DB_USER=mastodon
          DB_PASS=mastodon
          REDIS_HOST=172.17.0.1
          REDIS_PORT=6379
          RAILS_ENV=production
          EMAIL_DOMAIN_ALLOWLIST=example.com
          RAILS_SERVE_STATIC_FILES=true
          SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt
          # the whole point: Mastodon has to be allowed to fetch from, and
          # deliver to, the Nextcloud on this same runner
          ALLOWED_PRIVATE_ADDRESSES=127.0.0.1,::1,172.17.0.1
          ENV

          docker network create interop || true
          docker run -d --name mastodon-setup --network host --env-file /tmp/mastodon.env \
            -v /etc/ssl/certs/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro \
            ghcr.io/mastodon/mastodon:v4.3 \
            bundle exec rails db:setup
          docker wait mastodon-setup
          docker logs mastodon-setup | tail -20

          docker run -d --name mastodon-web --network host --env-file /tmp/mastodon.env \
            -v /etc/ssl/certs/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro \
            ghcr.io/mastodon/mastodon:v4.3 \
            bundle exec puma -C config/puma.rb
          docker run -d --name mastodon-sidekiq --network host --env-file /tmp/mastodon.env \
            -v /etc/ssl/certs/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro \
            ghcr.io/mastodon/mastodon:v4.3 \
            bundle exec sidekiq

      - name: Wait for Mastodon
        run: |
          for attempt in $(seq 1 60); do
            if curl -sf "$MASTODON_BASE_URL/api/v1/instance" > /dev/null; then
              echo "Mastodon is up"
              exit 0
            fi
            sleep 5
          done
          echo "Mastodon never came up"
          docker logs mastodon-web | tail -50
          exit 1

      - name: Make a Mastodon account and a token for it
        run: |
          set -euo pipefail
          docker exec mastodon-web bin/tootctl accounts create interop \
            --email interop@example.com --confirmed --approve --role Owner > /tmp/account.txt
          cat /tmp/account.txt
          # an application with the scopes the suite needs, and a token for an
          # account: `interop` acts in most tests, `stranger` follows nobody
          # on our side, and `guarded` is locked, so a follow of it waits
          token_for() {
            docker exec mastodon-web bin/rails runner "
              app = Doorkeeper::Application.find_or_create_by!(name: 'interop') do |a|
                a.redirect_uri = 'urn:ietf:wg:oauth:2.0:oob'
                a.scopes = 'read write follow'
              end
              account = Account.find_by(username: '$1', domain: nil)
              token = Doorkeeper::AccessToken.create!(
                application: app, resource_owner_id: account.user.id,
                scopes: app.scopes, expires_in: nil
              )
              puts token.token
            " | tail -1
          }
          echo "MASTODON_TOKEN=$(token_for interop)" >> "$GITHUB_ENV"
          for name in stranger guarded; do
            docker exec mastodon-web bin/tootctl accounts create "$name" \
              --email "$name@example.com" --confirmed --approve > /dev/null
          done
          docker exec mastodon-web bin/rails runner 'Account.find_local("guarded").update!(locked: true)'
          echo "MASTODON_TOKEN_STRANGER=$(token_for stranger)" >> "$GITHUB_ENV"
          echo "MASTODON_TOKEN_GUARDED=$(token_for guarded)" >> "$GITHUB_ENV"
          # the two accounts of the Move tests: `landing` is where our `mover`
          # moves to, and names it the way Mastodon's own form would; `leaver`
          # moves to our `arrival`, later, once this side has named it back
          docker exec mastodon-web bin/tootctl accounts create landing \
            --email landing@example.com --confirmed --approve > /dev/null
          docker exec mastodon-web bin/tootctl accounts create leaver \
            --email leaver@example.com --confirmed --approve > /dev/null
          docker exec mastodon-web bin/rails runner '
            Account.find_local("landing").update!(also_known_as: ["https://nextcloud.test/index.php/apps/social/@mover"])
            puts "landing also known as: #{Account.find_local("landing").also_known_as.inspect}"
          ' | tail -1

      - name: Start PeerTube
        run: |
          set -euo pipefail
          # its own database on the same server: PeerTube runs its migrations
          # on boot and will not share a schema with anybody
          PGPASSWORD=mastodon psql -h 127.0.0.1 -U mastodon -d mastodon_production \
            -c "CREATE DATABASE peertube_prod;" || true
          PGPASSWORD=mastodon psql -h 127.0.0.1 -U mastodon -d peertube_prod \
            -c "CREATE EXTENSION IF NOT EXISTS pg_trgm; CREATE EXTENSION IF NOT EXISTS unaccent;"

          cat > /tmp/peertube.env <<ENV
          PEERTUBE_WEBSERVER_HOSTNAME=localhost
          PEERTUBE_WEBSERVER_PORT=9000
          PEERTUBE_WEBSERVER_HTTPS=false
          PEERTUBE_DB_HOSTNAME=172.17.0.1
          PEERTUBE_DB_PORT=5432
          PEERTUBE_DB_NAME=peertube_prod
          PEERTUBE_DB_USERNAME=mastodon
          PEERTUBE_DB_PASSWORD=mastodon
          PEERTUBE_REDIS_HOSTNAME=172.17.0.1
          PEERTUBE_REDIS_PORT=6379
          PEERTUBE_ADMIN_EMAIL=interop@example.com
          PEERTUBE_SECRET=$(openssl rand -hex 32)
          # the same permission Mastodon needs, for the same reason: the
          # Nextcloud it has to fetch our actor and our video from is on this
          # very runner, at a private address
          PEERTUBE_FEDERATION_PREVENT_SSRF=false
          NODE_ENV=production
          # its validators say which field they refused only at debug level
          PEERTUBE_LOG_LEVEL=debug
          NODE_EXTRA_CA_CERTS=/tls/ca.crt
          ENV

          docker run -d --name peertube --network host --env-file /tmp/peertube.env \
            -v /tmp/tls:/tls:ro \
            chocobozzz/peertube:v8.3.1

      - name: Wait for PeerTube
        run: |
          for attempt in $(seq 1 90); do
            if curl -sf "$PEERTUBE_BASE_URL/api/v1/config" > /dev/null; then
              echo "PeerTube is up"
              exit 0
            fi
            sleep 5
          done
          echo "PeerTube never came up"
          docker logs peertube 2>&1 | tail -80
          exit 1

      - name: Make a PeerTube account
        run: |
          set -euo pipefail
          # the root account's password is printed once, at first boot
          ROOT_PASSWORD=$(docker logs peertube 2>&1 \
            | grep -oP 'User password: \K\S+' | tail -1)
          if [ -z "$ROOT_PASSWORD" ]; then
            echo "PeerTube never printed a root password"
            docker logs peertube 2>&1 | tail -80
            exit 1
          fi
          docker exec -e PT_INITIAL_ROOT_PASSWORD="$ROOT_PASSWORD" peertube \
            npm run create-import-video-file-job -- --help > /dev/null 2>&1 || true
          # a plain user for the suite, made through the API as root
          CLIENT=$(curl -sf "$PEERTUBE_BASE_URL/api/v1/oauth-clients/local")
          CLIENT_ID=$(echo "$CLIENT" | python3 -c 'import sys,json;print(json.load(sys.stdin)["client_id"])')
          CLIENT_SECRET=$(echo "$CLIENT" | python3 -c 'import sys,json;print(json.load(sys.stdin)["client_secret"])')
          ROOT_TOKEN=$(curl -sf -X POST "$PEERTUBE_BASE_URL/api/v1/users/token" \
            -d "client_id=$CLIENT_ID" -d "client_secret=$CLIENT_SECRET" \
            -d 'grant_type=password' -d 'response_type=code' \
            -d 'username=root' --data-urlencode "password=$ROOT_PASSWORD" \
            | python3 -c 'import sys,json;print(json.load(sys.stdin)["access_token"])')
          curl -sf -X POST "$PEERTUBE_BASE_URL/api/v1/users" \
            -H "Authorization: Bearer $ROOT_TOKEN" -H 'Content-Type: application/json' \
            -d "{\"username\":\"$PEERTUBE_USER\",\"password\":\"$PEERTUBE_PASSWORD\",\"email\":\"interop-user@example.com\",\"role\":2,\"videoQuota\":-1,\"videoQuotaDaily\":-1}"
          # a few seconds of test card and tone for the inbound video tests,
          # made by PeerTube's own ffmpeg so it is a file PeerTube can read
          docker exec peertube ffmpeg -loglevel error -y \
            -f lavfi -i testsrc=duration=4:size=320x240:rate=15 \
            -f lavfi -i sine=frequency=440:duration=4 \
            -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest /tmp/interop-sample.mp4
          docker cp peertube:/tmp/interop-sample.mp4 /tmp/interop-sample.mp4
          echo "PEERTUBE_SAMPLE_VIDEO=/tmp/interop-sample.mp4" >> "$GITHUB_ENV"

      - name: Interop tests
        working-directory: apps/social
        # the suite needs phpunit; installed only now, once the server is up
        # and the app enabled with what ships
        # one suite at a time, so each prints its own failures even if the
        # other hangs or the runner is lost
        run: |
          composer i
          # memory and the biggest processes every five seconds, so a runner
          # that is lost mid-test leaves a trail; and a PHP limit, so a runaway
          # test dies with a stack trace instead of taking the runner with it
          (while sleep 5; do
            echo "[mem] $(free -m | awk '/Mem:/ {print $3 " MB used, " $7 " MB available"}')" \
              "| $(ps -eo rss=,comm= --sort=-rss | head -3 | awk '{printf "%s %d MB, ", $2, $1/1024}')"
          done) &
          status=0
          timeout 900 php -d memory_limit=1G vendor/bin/phpunit -c tests/Interop/phpunit.xml --filter MastodonDeliveryTest || status=1
          timeout 1200 php -d memory_limit=1G vendor/bin/phpunit -c tests/Interop/phpunit.xml --filter MastodonInboundTest || status=1
          timeout 1200 php -d memory_limit=1G vendor/bin/phpunit -c tests/Interop/phpunit.xml --filter MastodonOutboundTest || status=1
          timeout 900 php -d memory_limit=1G vendor/bin/phpunit -c tests/Interop/phpunit.xml --filter MastodonNotificationPolicyTest || status=1
          # what each side makes of our account, asked directly, so a failure
          # above can be told apart from a failure to reach us at all
          WF="https://nextcloud.test/.well-known/webfinger?resource=acct:admin@nextcloud.test"
          echo "--- webfinger from the runner"
          curl -s -w '\n%{http_code}\n' "$WF" | head -c 800; echo
          echo "--- webfinger and resolve from inside Mastodon"
          docker exec mastodon-web bin/rails runner '
            begin
              r = Webfinger.new("acct:admin@nextcloud.test").perform
              puts "webfinger: #{r.subject} -> #{r.self_link_href}"
            rescue => e
              puts "webfinger: #{e.class}: #{e.message}"
            end
            begin
              a = ResolveAccountService.new.call("admin@nextcloud.test")
              puts "resolve: #{a.inspect}"
            rescue => e
              puts "resolve: #{e.class}: #{e.message}"
            end
          ' 2>&1 | tail -20 || true
          # the Move, both ways. Ours first; then this side names Mastodon's
          # leaver and follows it, Mastodon delivers the Move signed by the
          # leaver, and the last suite reads what this side did with it
          timeout 600 php -d memory_limit=1G vendor/bin/phpunit -c tests/Interop/phpunit.xml --filter MoveOutboundTest || status=1
          timeout 600 php -d memory_limit=1G vendor/bin/phpunit -c tests/Interop/phpunit.xml --filter MoveInboundPrepareTest || status=1
          docker exec mastodon-web bin/rails runner '
            leaver = Account.find_local("leaver")
            target = ResolveAccountService.new.call("arrival@nextcloud.test")
            raise "arrival could not be resolved" if target.nil?
            raise "arrival does not list leaver: #{target.also_known_as.inspect}" unless target.also_known_as.include?(ActivityPub::TagManager.instance.uri_for(leaver))
            leaver.update!(moved_to_account: target)
            uri = ActivityPub::TagManager.instance.uri_for(leaver)
            json = Oj.dump({ "@context" => "https://www.w3.org/ns/activitystreams", "id" => "#{uri}#moves/#{Time.now.to_i}", "type" => "Move", "actor" => uri, "object" => uri, "target" => target.uri })
            ActivityPub::DeliveryWorker.new.perform(json, leaver.id, "https://nextcloud.test/index.php/apps/social/@admin/inbox")
            puts "Move delivered: #{uri} -> #{target.uri}"
          ' 2>&1 | tail -3 || status=1
          timeout 600 php -d memory_limit=1G vendor/bin/phpunit -c tests/Interop/phpunit.xml --filter MoveInboundTest || status=1
          # the wizard's half: the old account read from the new side
          timeout 600 php -d memory_limit=1G vendor/bin/phpunit -c tests/Interop/phpunit.xml --filter MoveInFromMastodonTest || status=1
          timeout 900 php -d memory_limit=1G vendor/bin/phpunit -c tests/Interop/phpunit.xml --filter PeerTubeDeliveryTest || status=1
          timeout 1200 php -d memory_limit=1G vendor/bin/phpunit -c tests/Interop/phpunit.xml --filter PeerTubeInboundTest || status=1
          exit $status

      - name: What each side saw, when it went wrong
        if: failure()
        run: |
          echo '--- Nextcloud log, notices and worse ---'
          python3 -c 'import json,sys
          for l in open("data/nextcloud.log"):
              try: d=json.loads(l)
              except Exception: continue
              m=d.get("message","")
              if d.get("level",0)>=1 and "headers already sent" not in m: print(d.get("time"),d.get("level"),d.get("app"),m[:300])' | tail -120 || true
          echo '--- hosts the circuit breaker held back ---'
          sqlite3 -header data/nextcloud.db "select * from oc_social_host_breaker" 2>&1 || true
          echo '--- our delivery queue ---'
          sqlite3 -header data/nextcloud.db \
            "select id, token, status, tries, priority, substr(instance,1,90) as instance, substr(activity,1,80) as activity from oc_social_req_queue order by id" 2>&1 \
            || sqlite3 data/nextcloud.db ".tables" | tr ' ' '\n' | grep -i queue
          echo '--- every delivery through the proxy (Mastodon side; PeerTube is reached directly) ---'
          docker logs proxy 2>&1 | python3 -c 'import json,sys,datetime
          for l in sys.stdin:
              try: d=json.loads(l)
              except Exception: continue
              r=d.get("request")
              if not r or r["method"]=="GET" and "webfinger" not in r["uri"]: continue
              print(datetime.datetime.utcfromtimestamp(d["ts"]).strftime("%H:%M:%S"), d.get("status"), r["method"], r["host"], r["uri"][:80], (r.get("headers",{}).get("User-Agent") or [""])[0][:20])' || true
          echo '--- what Mastodon holds from us ---'
          docker exec mastodon-web bin/rails runner '
            a = Account.find_by(username: "admin", domain: "nextcloud.test")
            puts "account: #{a&.id} followers here: #{a&.followers&.count}"
            Status.where(account: a).order(:id).each { |s| puts [s.id, s.uri, s.spoiler_text, s.edited_at, s.reblog_of_id, s.deleted_at].inspect } if a
          ' 2>&1 | tail -30 || true
          echo '--- the last Update we queued, and what Mastodon makes of it ---'
          sqlite3 data/nextcloud.db \
            "select activity from oc_social_req_queue where json_extract(activity, '$.type') = 'Update' order by id desc limit 1" \
            > /tmp/update.json || true
          python3 -c 'import json; d=json.load(open("/tmp/update.json")); o=d.get("object",{}); print({k: d.get(k) for k in ("id","type","actor")}); print({k: o.get(k) for k in ("id","type","published","updated","content")})' || true
          if [ -s /tmp/update.json ]; then
            docker cp /tmp/update.json mastodon-web:/tmp/update.json
            docker exec mastodon-web bin/rails runner '
              json = JSON.parse(File.read("/tmp/update.json"))
              account = Account.find_by(username: "admin", domain: "nextcloud.test")
              status = Status.find_by(uri: json["object"]["id"])
              puts "before: #{status&.text.inspect} edited_at=#{status&.edited_at.inspect} created_at=#{status&.created_at.inspect}"
              parser = ActivityPub::Parser::StatusParser.new(json)
              puts "parser edited_at=#{parser.edited_at.inspect}"
              ActivityPub::Activity.factory(json, account).perform
              status&.reload
              puts "after: #{status&.text.inspect} edited_at=#{status&.edited_at.inspect}"
            ' 2>&1 | tail -10 || true
          fi
          echo '--- the last Create we sent PeerTube ---'
          sqlite3 data/nextcloud.db \
            "select activity from oc_social_req_queue where instance like '%localhost:9000%' and json_extract(activity, '$.type') = 'Create' order by id desc limit 1" \
            | python3 -c 'import json,sys
          raw=sys.stdin.read().strip()
          if not raw: print("none"); sys.exit()
          o=json.loads(raw).get("object",{})
          print(json.dumps({k: o.get(k) for k in ("type","id","uuid","name","duration","attributedTo","icon","url","state","mediaType","to","cc")}, indent=1)[:3000])' || true
          echo '--- what we hold from PeerTube ---'
          sqlite3 -header data/nextcloud.db \
            "select nid, type, substr(id,1,70) as id, substr(attributed_to,1,60) as author, substr(object_id,1,60) as object, media_kind from oc_social_stream where id like 'http://localhost:9000%' or object_id like 'http://localhost:9000%' order by nid" 2>&1 | tail -40 || true
          echo '--- Mastodon sidekiq, without the mailer noise ---'
          docker logs mastodon-sidekiq 2>&1 | grep -v -E "action_mailer|actionmailer|mail-2|SMTP|^/usr/local/bundle" \
            | grep -i -E "fail|error|warn|reject|ActivityPub" | tail -60 || true
          echo '--- PeerTube ---'
          # the one that matters: PeerTube refuses a video in its own log and
          # answers the delivery 204, so this is where a silent drop is visible
          docker logs peertube 2>&1 | grep -i -E "not valid|invalid|refus|Receiving inbox|error|cannot" \
            | grep -v -E "SMTP|GET /api/v1/(video-channels|search)" | cut -c1-600 | tail -60 || true
