#
# Interop: this app's activities delivered to a real Mastodon and a real
# PeerTube, read back out of each one's own API. See tests/Interop/README.md for
# why, and for what this cannot prove.
#
# Deliberately NOT on `pull_request`. It stands up four containers and depends
# on a third-party image whose startup this repository does not control, so a
# bad day for that image would block every pull request on a failure that says
# nothing about the change under review. Run it by hand from the Actions tab,
# or leave the weekly run to find drift; make it required once it has been
# green for a while.

name: Interop against Mastodon and PeerTube

on:
  workflow_dispatch:
  schedule:
    # Mondays, early: a week is the right cadence for "has the other end moved"
    - cron: '17 4 * * 1'

permissions:
  contents: read

concurrency:
  group: interop-mastodon-${{ github.ref }}
  cancel-in-progress: true

jobs:
  interop:
    runs-on: ubuntu-latest
    name: Nextcloud Social ↔ Mastodon, PeerTube

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mastodon
          POSTGRES_PASSWORD: mastodon
          POSTGRES_DB: mastodon_production
        options: >-
          --health-cmd "pg_isready -U mastodon"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 6379:6379

    env:
      APP_NAME: social
      # Both sides talk to each other over the runner's own loopback, so both
      # have to be willing to. Mastodon refuses private addresses unless it is
      # told otherwise, and Nextcloud's HTTP client refuses localhost unless it
      # is told otherwise; each gets exactly that one permission and nothing
      # else, because it is a throwaway runner and not a real deployment.
      MASTODON_HOST: localhost:3000
      MASTODON_BASE_URL: http://localhost:3000
      PEERTUBE_HOST: localhost:9000
      PEERTUBE_BASE_URL: http://localhost:9000
      PEERTUBE_USER: interop
      PEERTUBE_PASSWORD: Interop-Test-2026!
      NEXTCLOUD_URL: http://localhost:8080

    steps:
      - name: Checkout server
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: true
          repository: nextcloud/server
          # see e2e.yml: the newest version info.xml claims
          ref: master

      - name: Checkout app
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: apps/social

      - name: Set up php
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          extensions: bz2, ctype, curl, dom, fileinfo, gd, iconv, intl, json, libxml, mbstring, openssl, pcntl, posix, session, simplexml, xmlreader, xmlwriter, zip, zlib, sqlite, pdo_sqlite
          coverage: none
          ini-file: development

      - name: Set up the app's PHP dependencies
        working-directory: apps/social
        # without the dev ones, as the app store ships it: the app's autoloader
        # is prepended to the server's, so a dev-only package the server also
        # carries (symfony/console) is served in place of the server's own
        run: composer i --no-dev

      - name: Set up Nextcloud
        run: |
          mkdir data
          ./occ maintenance:install --verbose --database=sqlite --database-name=nextcloud \
            --admin-user admin --admin-pass admin
          ./occ app:enable --force social
          ./occ config:system:set trusted_domains 1 --value localhost:8080
          ./occ config:system:set overwrite.cli.url --value "$NEXTCLOUD_URL"
          ./occ config:app:set social cloud_url --value "$NEXTCLOUD_URL"
          ./occ config:app:set social social_url --value "$NEXTCLOUD_URL/index.php/apps/social/"
          # the two instances are on the same host, so both HTTP clients have to
          # be willing to talk to a private address
          ./occ config:system:set allow_local_remote_servers --value true --type boolean

      - name: Run Nextcloud
        # several workers: rendering or fetching anything makes the server ask
        # itself over HTTP, and a single-worker built-in server deadlocks on that
        run: PHP_CLI_SERVER_WORKERS=8 php -S localhost:8080 &

      - name: Start Mastodon
        run: |
          set -euo pipefail
          # the keys Mastodon refuses to boot without. Generated here and thrown
          # away with the runner: they protect nothing, because there is nothing
          # in this instance that outlives the job.
          SECRET_KEY_BASE=$(openssl rand -hex 64)
          OTP_SECRET=$(openssl rand -hex 64)
          AR_KEYS="ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY=$(openssl rand -hex 16)"
          AR_KEYS="$AR_KEYS,ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT=$(openssl rand -hex 16)"
          AR_KEYS="$AR_KEYS,ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY=$(openssl rand -hex 16)"

          cat > /tmp/mastodon.env <<ENV
          LOCAL_DOMAIN=${MASTODON_HOST}
          LOCAL_HTTPS=false
          SECRET_KEY_BASE=${SECRET_KEY_BASE}
          OTP_SECRET=${OTP_SECRET}
          $(echo "$AR_KEYS" | tr ',' '\n')
          DB_HOST=172.17.0.1
          DB_PORT=5432
          DB_NAME=mastodon_production
          DB_USER=mastodon
          DB_PASS=mastodon
          REDIS_HOST=172.17.0.1
          REDIS_PORT=6379
          RAILS_ENV=production
          EMAIL_DOMAIN_ALLOWLIST=example.com
          RAILS_SERVE_STATIC_FILES=true
          # the whole point: Mastodon has to be allowed to fetch from, and
          # deliver to, the Nextcloud on this same runner
          ALLOWED_PRIVATE_ADDRESSES=127.0.0.1,::1,172.17.0.1
          ENV

          docker network create interop || true
          docker run -d --name mastodon-setup --network host --env-file /tmp/mastodon.env \
            ghcr.io/mastodon/mastodon:v4.3 \
            bundle exec rails db:setup
          docker wait mastodon-setup
          docker logs mastodon-setup | tail -20

          docker run -d --name mastodon-web --network host --env-file /tmp/mastodon.env \
            ghcr.io/mastodon/mastodon:v4.3 \
            bundle exec puma -C config/puma.rb
          docker run -d --name mastodon-sidekiq --network host --env-file /tmp/mastodon.env \
            ghcr.io/mastodon/mastodon:v4.3 \
            bundle exec sidekiq

      - name: Wait for Mastodon
        run: |
          for attempt in $(seq 1 60); do
            if curl -sf "$MASTODON_BASE_URL/api/v1/instance" > /dev/null; then
              echo "Mastodon is up"
              exit 0
            fi
            sleep 5
          done
          echo "Mastodon never came up"
          docker logs mastodon-web | tail -50
          exit 1

      - name: Make a Mastodon account and a token for it
        run: |
          set -euo pipefail
          docker exec mastodon-web bin/tootctl accounts create interop \
            --email interop@example.com --confirmed --role Owner > /tmp/account.txt
          cat /tmp/account.txt
          # an application with the scopes the suite needs, and a token for it
          TOKEN=$(docker exec mastodon-web bin/rails runner '
            app = Doorkeeper::Application.create!(
              name: "interop", redirect_uri: "urn:ietf:wg:oauth:2.0:oob",
              scopes: "read write follow"
            )
            account = Account.find_by(username: "interop")
            token = Doorkeeper::AccessToken.create!(
              application: app, resource_owner_id: account.user.id,
              scopes: app.scopes, expires_in: nil
            )
            puts token.token
          ' | tail -1)
          echo "MASTODON_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Start PeerTube
        run: |
          set -euo pipefail
          # its own database on the same server: PeerTube runs its migrations
          # on boot and will not share a schema with anybody
          PGPASSWORD=mastodon psql -h 127.0.0.1 -U mastodon -d mastodon_production \
            -c "CREATE DATABASE peertube_prod;" || true
          PGPASSWORD=mastodon psql -h 127.0.0.1 -U mastodon -d peertube_prod \
            -c "CREATE EXTENSION IF NOT EXISTS pg_trgm; CREATE EXTENSION IF NOT EXISTS unaccent;"

          cat > /tmp/peertube.env <<ENV
          PEERTUBE_WEBSERVER_HOSTNAME=localhost
          PEERTUBE_WEBSERVER_PORT=9000
          PEERTUBE_WEBSERVER_HTTPS=false
          PEERTUBE_DB_HOSTNAME=172.17.0.1
          PEERTUBE_DB_PORT=5432
          PEERTUBE_DB_NAME=peertube_prod
          PEERTUBE_DB_USERNAME=mastodon
          PEERTUBE_DB_PASSWORD=mastodon
          PEERTUBE_REDIS_HOSTNAME=172.17.0.1
          PEERTUBE_REDIS_PORT=6379
          PEERTUBE_ADMIN_EMAIL=interop@example.com
          PEERTUBE_SECRET=$(openssl rand -hex 32)
          # the same permission Mastodon needs, for the same reason: the
          # Nextcloud it has to fetch our actor and our video from is on this
          # very runner
          PEERTUBE_FEDERATION_SIGN_FETCHES_ENABLED=false
          NODE_ENV=production
          ENV

          docker run -d --name peertube --network host --env-file /tmp/peertube.env \
            chocobozzz/peertube:production-bookworm

      - name: Wait for PeerTube
        run: |
          for attempt in $(seq 1 90); do
            if curl -sf "$PEERTUBE_BASE_URL/api/v1/config" > /dev/null; then
              echo "PeerTube is up"
              exit 0
            fi
            sleep 5
          done
          echo "PeerTube never came up"
          docker logs peertube 2>&1 | tail -80
          exit 1

      - name: Make a PeerTube account
        run: |
          set -euo pipefail
          # the root account's password is printed once, at first boot
          ROOT_PASSWORD=$(docker logs peertube 2>&1 \
            | grep -oP 'User password: \K\S+' | tail -1)
          if [ -z "$ROOT_PASSWORD" ]; then
            echo "PeerTube never printed a root password"
            docker logs peertube 2>&1 | tail -80
            exit 1
          fi
          docker exec -e PT_INITIAL_ROOT_PASSWORD="$ROOT_PASSWORD" peertube \
            npm run create-import-video-file-job -- --help > /dev/null 2>&1 || true
          # a plain user for the suite, made through the API as root
          CLIENT=$(curl -sf "$PEERTUBE_BASE_URL/api/v1/oauth-clients/local")
          CLIENT_ID=$(echo "$CLIENT" | python3 -c 'import sys,json;print(json.load(sys.stdin)["client_id"])')
          CLIENT_SECRET=$(echo "$CLIENT" | python3 -c 'import sys,json;print(json.load(sys.stdin)["client_secret"])')
          ROOT_TOKEN=$(curl -sf -X POST "$PEERTUBE_BASE_URL/api/v1/users/token" \
            -d "client_id=$CLIENT_ID" -d "client_secret=$CLIENT_SECRET" \
            -d 'grant_type=password' -d 'response_type=code' \
            -d 'username=root' --data-urlencode "password=$ROOT_PASSWORD" \
            | python3 -c 'import sys,json;print(json.load(sys.stdin)["access_token"])')
          curl -sf -X POST "$PEERTUBE_BASE_URL/api/v1/users" \
            -H "Authorization: Bearer $ROOT_TOKEN" -H 'Content-Type: application/json' \
            -d "{\"username\":\"$PEERTUBE_USER\",\"password\":\"$PEERTUBE_PASSWORD\",\"email\":\"interop-user@example.com\",\"role\":2,\"videoQuota\":-1,\"videoQuotaDaily\":-1}"

      - name: Interop tests
        working-directory: apps/social
        # the suite needs phpunit; installed only now, once the server is up
        # and the app enabled with what ships
        run: |
          composer i
          composer run test:interop

      - name: What each side saw, when it went wrong
        if: failure()
        run: |
          echo '--- Nextcloud ---'
          tail -100 ../../data/nextcloud.log || true
          echo '--- Mastodon web ---'
          docker logs mastodon-web 2>&1 | tail -100 || true
          echo '--- Mastodon sidekiq ---'
          docker logs mastodon-sidekiq 2>&1 | tail -100 || true
          echo '--- PeerTube ---'
          # the one that matters: PeerTube refuses a video in its own log and
          # answers the delivery 204, so this is where a silent drop is visible
          docker logs peertube 2>&1 | tail -150 || true
