# SPDX-FileCopyrightText: 2024 Nextcloud GmbH and Nextcloud contributors
# SPDX-License-Identifier: AGPL-3.0-or-later
version = 1
SPDX-PackageName = "Nextcloud Social"
SPDX-PackageSupplier = "Nextcloud <https://nextcloud.com/contact/>"
SPDX-PackageDownloadLocation = "https://github.com/alohasocial/social"

[[annotations]]
path = ["package-lock.json", "package.json", "composer.json", "composer.lock", "jsconfig.json", "jsconfig.vue.json", ".tx/config", "tests/Interop/atproto/package.json", "tests/Interop/atproto/package-lock.json"]
precedence = "aggregate"
SPDX-FileCopyrightText = "none"
SPDX-License-Identifier = "CC0-1.0"

[[annotations]]
path = "l10n/*"
precedence = "aggregate"
SPDX-FileCopyrightText = "2018 Nextcloud translators"
SPDX-License-Identifier = "AGPL-3.0-or-later"

[[annotations]]
# This Sass partial is embedded as source text in the generated Vue chunk.
path = "src/styles/_layout.scss"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Nextcloud GmbH and Nextcloud contributors"
SPDX-License-Identifier = "AGPL-3.0-or-later"

[[annotations]]
# The list of Google's Noto Animated Emoji the composer offers. Only the list
# is here; the pictures are fetched by the instance and kept in appdata, and
# they carry the same licence. See lib/Service/GifPackService.php.
path = "data/noto-animated-emoji.json"
precedence = "aggregate"
SPDX-FileCopyrightText = "Google LLC"
SPDX-License-Identifier = "CC-BY-4.0"

[[annotations]]
# The AT Protocol interoperability test vectors, copied from
# github.com/bluesky-social/atproto-interop-tests; the protocol primitives
# under lib/Atproto are pinned by them.
path = "tests/Atproto/fixtures/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "Bluesky Social PBC"
SPDX-License-Identifier = "CC0-1.0"

[[annotations]]
# The BIP-39 English word list, which encodes a Bluesky recovery key as
# twelve words a person can write down. See lib/Atproto/Identity/Mnemonic.php.
path = "resources/atproto/bip39-english.txt"
precedence = "aggregate"
SPDX-FileCopyrightText = "2013 Marek Palatinus, Pavol Rusnak, Aaron Voisine, Sean Bowe"
SPDX-License-Identifier = "MIT"

[[annotations]]
# The AT Protocol lexicon documents this app validates records against, and
# the query lexicons its tests check the served XRPC answers against, copied
# from github.com/bluesky-social/atproto (dual MIT / Apache-2.0).
path = ["lib/Atproto/lexicons/*.json", "tests/Atproto/lexicons/*.json"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2022-2026 Bluesky Social PBC, and Contributors"
SPDX-License-Identifier = "MIT OR Apache-2.0"

[[annotations]]
path = "img/nextcloud.png"
precedence = "aggregate"
SPDX-FileCopyrightText = "2016 Nextcloud GmbH"
SPDX-License-Identifier = "LicenseRef-NextcloudTrademarks"

[[annotations]]
path = ["context/*.json", "tests/phpunit.xml"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2019 Nextcloud GmbH and Nextcloud contributors"
SPDX-License-Identifier = "AGPL-3.0-or-later"

[[annotations]]
path = ["tests/Federation/fixtures/*.json", "tests/Federation/golden/*.json", "tests/Federation/signatures/*.json", "tests/Atproto/Reader/Jetstream/fixtures/*.json", "tests/Atproto/Identity/fixtures/*.json"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Nextcloud GmbH and Nextcloud contributors"
SPDX-License-Identifier = "AGPL-3.0-or-later"

[[annotations]]
# The accessibility violations the browser tests already know of, written by
# tests/e2e/accessibility.spec.mjs.
path = "tests/e2e/a11y-baseline.json"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Nextcloud GmbH and Nextcloud contributors"
SPDX-License-Identifier = "AGPL-3.0-or-later"

[[annotations]]
# Public did:plc audit logs and DID documents of three organisation accounts,
# fetched from plc.directory on 2026-10-09: directory data, signed by the
# accounts' own keys, not authored here. See
# tests/Atproto/Identity/PlcAuditLogTest.php.
path = "tests/Atproto/Identity/plc/*.json"
precedence = "aggregate"
SPDX-FileCopyrightText = "NONE"
SPDX-License-Identifier = "CC0-1.0"

# the Mastodon entity schemas the client API is validated against, written
# for this app from the Mastodon documentation (see tests/Api/Schema/README.md)
[[annotations]]
path = "tests/Api/Schema/mastodon/*.json"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Nextcloud GmbH and Nextcloud contributors"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# the timings the nightly benchmark is held to, which JSON cannot annotate
[[annotations]]
path = "tests/perf/benchmark-baseline.json"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Nextcloud GmbH and Nextcloud contributors"
SPDX-License-Identifier = "AGPL-3.0-or-later"

[[annotations]]
# Synthetic, deterministic inputs for the recommendation evaluation harness.
path = "tools/recommendations/fixtures/synthetic-v1.json"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Aloha Social contributors"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# the schemas the migration history produced, which carry no comment syntax
[[annotations]]
path = ["tests/Migration/schema.json", "tests/Migration/schema-*.json"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Nextcloud GmbH and Nextcloud contributors"
SPDX-License-Identifier = "AGPL-3.0-or-later"

[[annotations]]
# Metadata for the locally maintained MIT webpack polyfill plugin.
path = "packages/node-polyfill-webpack-plugin/package.json"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Aloha Social contributors"
SPDX-License-Identifier = "MIT"

[[annotations]]
# A compatibility patch against the MIT-licensed ATProto OAuth provider.
path = "tests/Interop/atproto/patches/@atproto+oauth-provider+0.24.3.patch"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Aloha Social contributors"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = ["psalm.xml", "tests/psalm-baseline.xml", "tests/stub.phpstub"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2022 Nextcloud GmbH and Nextcloud contributors"
SPDX-License-Identifier = "AGPL-3.0-or-later"

[[annotations]]
path = ["img/add_user.svg", "img/boost.svg", "img/emoji.svg", "img/favicon.ico", "img/notifications.svg", "img/reply.svg", "img/social-promo.png"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2018-2024 Google LLC"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = ["img/social.svg", "img/social-dark.svg", "img/social_dark.svg"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Nextcloud GmbH and Nextcloud contributors"
SPDX-License-Identifier = "AGPL-3.0-or-later"

[[annotations]]
path = ["js/*", "js-backup/*"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2025 Nextcloud GmbH and Nextcloud contributors"
SPDX-License-Identifier = "AGPL-3.0-or-later"

[[annotations]]
path = ["*.md", "docs/*", ".github/ISSUE_TEMPLATE/*", ".github/pull_request_template.md"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2025 Nextcloud GmbH and Nextcloud contributors"
SPDX-License-Identifier = "AGPL-3.0-or-later"

[[annotations]]
path = [".htaccess", "appinfo/.htaccess", "context/.htaccess", "src/.htaccess", ".gitignore"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2025 Nextcloud GmbH and Nextcloud contributors"
SPDX-License-Identifier = "AGPL-3.0-or-later"

[[annotations]]
path = ["deploy.sh", "build-package.sh"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2025 Nextcloud GmbH and Nextcloud contributors"
SPDX-License-Identifier = "AGPL-3.0-or-later"

[[annotations]]
path = ["img/screenshot.png", "img/social-promo.png"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2025 Nextcloud GmbH and Nextcloud contributors"
SPDX-License-Identifier = "AGPL-3.0-or-later"

[[annotations]]
path = "img/readme/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Nextcloud GmbH and Nextcloud contributors"
SPDX-License-Identifier = "AGPL-3.0-or-later"


[[annotations]]
path = "tests/*"
precedence = "aggregate"
SPDX-FileCopyrightText = "2025 Nextcloud GmbH and Nextcloud contributors"
SPDX-License-Identifier = "AGPL-3.0-or-later"

[[annotations]]
path = "CLAUDE.md"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Aloha Social contributors"
SPDX-License-Identifier = "AGPL-3.0-or-later"
